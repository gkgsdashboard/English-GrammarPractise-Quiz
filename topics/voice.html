<style>
:root{
  --accent:#2ec4b6;
  --accent-dark:#1da89a;
  --muted:#69707a;
  --success:#1f9e5a;
  --danger:#c82d3f;
  --bg:#f5f7fa;
  --card:#fff;
  --maxw:820px;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#111;padding-bottom:120px}
.container{max-width:var(--maxw);margin:auto;padding:10px 16px}
header{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.08);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:12px}
h1{margin:0;color:var(--accent);font-size:18px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent-dark)}
.btn-ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);padding:8px 12px;border-radius:999px;font-weight:700;cursor:pointer}
.timer-text{color:var(--accent-dark);font-weight:700;font-size:18px;min-width:72px;text-align:right}
.toggle-pill{position:relative;width:90px;height:30px;background:#eaeef0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:13px;color:#444;font-weight:600}
.toggle-pill span{z-index:2;flex:1;text-align:center;pointer-events:none}
.toggle-pill::before{content:"";position:absolute;top:3px;left:3px;width:42px;height:24px;background:var(--accent);border-radius:999px;transition:.28s}
.toggle-pill.active::before{transform:translateX(45px);background:var(--accent-dark)}
.toggle-pill.active span:last-child{color:#fff}
.toggle-pill span:first-child{color:#fff}
.card{background:var(--card);border-radius:10px;padding:15px;margin:12px 0;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qmeta, .marking{font-size:13px;color:var(--muted)}
.qtext{font-size:16px;margin-bottom:15px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:10px}
.opt{padding:12px;border:1px solid #e6eaec;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent)}
.opt.selected{border:2px solid var(--accent)}
.opt.correct{border:2px solid var(--success);background:rgba(31,158,90,0.1)}
.opt.wrong{border:2px solid var(--danger);background:rgba(200,45,63,0.1)}
.fbar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -3px 12px rgba(0,0,0,0.08);display:flex;justify-content:center;z-index:50}
.fbar-inner{display:flex;justify-content:center;gap:15px;width:100%;padding:15px}

/* SCROLLABLE PALETTE */
#palette{position:fixed;top:70px;right:20px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.15);padding:15px;display:none;flex-direction:column;z-index:200;max-width:280px;max-height:70vh;}
.palette-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;overflow-y:auto;padding-right:5px;}
.qbtn{width:40px;height:40px;border-radius:6px;border:1px solid #ddd;cursor:pointer;font-weight:bold;flex-shrink:0;}
.qbtn.answered{background:var(--accent);color:white;border:none}
.qbtn.current{border:2px solid var(--accent);background:rgba(46,196,182,0.1)}
#palette-summary{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid #eee;padding-top:8px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:300}
.modal-content{background:#fff;padding:25px;border-radius:12px;text-align:center;width:90%;max-width:420px}
.explanation{margin-top:15px;padding:12px;background:#f0f7f7;border-radius:8px;display:none;font-size:14px;border-left:4px solid var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));gap:10px;margin-bottom:20px}
.stat-box{background:#f8fafb;padding:10px;border-radius:8px;border:1px solid #eef1f2;text-align:center}
.stat-box h4{margin:0;font-size:12px;color:var(--muted)}
.stat-box p{margin:5px 0 0;font-weight:bold;font-size:18px;color:var(--accent)}
.review-q{border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px;}
.review-opt{padding: 8px; margin: 4px 0; border-radius: 5px; font-size: 14px;}

.part-btn {
  display: block; width: 100%; background: #f0f4f8; border: 1px solid #dcdfe4; padding: 12px;
  margin: 10px 0; border-radius: 8px; text-align: left; font-size: 14px; cursor: pointer; font-weight: 600;
}
.part-btn:hover { background: var(--accent); color: white; border-color: var(--accent-dark); }

/* Wording Highlight Style */
.wrong-marked { color: #d9383a !important; font-weight: bold; }
.wrong-badge { background: #ffebeb; color: #d9383a; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 8px; border: 1px solid #fabadc; }
</style>

<script>
let PASSAGE_TEXT = "";
const QUESTIONS = [
  /* =========================================================
     PART 1: GRAMMAR CLASS 74 PRACTICE SHEET (Q1 - Q90) -> Index 0-89
     ========================================================= */
  { id: 1, pdfNo: "Q.1", isWrongInPdf: false, question: "Ishika saw the tiger in the forest.", options: ["The tiger saw by Ishika in the forest", "The tiger was seen by the forest in Ishika.", "The tiger was seen by Ishika in the forest.", "The tiger sees Ishika in the forest."], answer: 2, explanation: "Simple Past ('saw') changes to 'was/were + V3' ('was seen') in passive voice[cite: 18]." },
  { id: 2, pdfNo: "Q.2", isWrongInPdf: false, question: "Lovely tunes are composed by Domnica.", options: ["Domnica composed lovely tunes", "Domnica composes tunes lovely.", "Domnica will compose lovely tunes.", "Domnica composes lovely tunes."], answer: 3, explanation: "Simple Present passive ('are composed') changes back to Simple Present active ('composes')[cite: 18]." },
  { id: 3, pdfNo: "Q.3", isWrongInPdf: false, question: "The meal was not prepared by us.", options: ["We had not prepare the meal.", "We did not prepare the meal.", "We did not preparing the meal.", "We did prepare the meal."], answer: 1, explanation: "Simple Past negative passive ('was not prepared') corresponds to active 'did not + V1'[cite: 18]." },
  { id: 4, pdfNo: "Q.4", isWrongInPdf: false, question: "The homework must be done by you.", options: ["You should have done the homework.", "You do the homework.", "You will do the homework.", "You must do the homework."], answer: 3, explanation: "Modal passive 'must be done' returns to active modal absolute form 'must do'[cite: 18]." },
  { id: 5, pdfNo: "Q.5", isWrongInPdf: false, question: "The painting was admired by art enthusiasts from around the world.", options: ["The painting was being admired by art enthusiasts from around the world.", "Art enthusiasts from around the world admired the painting.", "Art enthusiasts from around the world have admired the painting.", "The painting has been admired by art enthusiasts from around the world."], answer: 1, explanation: "Simple Past passive structure maps back cleanly into Simple Past active inflection format[cite: 18]." },
  { id: 6, pdfNo: "Q.6", isWrongInPdf: false, question: "He will be made President by the people.", options: ["People will be making him the President", "The people will make him President", "By the people, he shall be made the President.", "He will be made President by the people."], answer: 1, explanation: "Future modal passive 'will be made' reverts back to active simple future 'will make'[cite: 18]." },
  { id: 7, pdfNo: "Q.7", isWrongInPdf: false, question: "The contract was grabbed by the biggest telecom company in India.", options: ["The biggest telecom company in India grabbed the contract.", "The biggest telecom company in India grabs the contract.", "The biggest telecom company in India will grab the contract.", "The biggest telecom company in India has grabbed the contract."], answer: 0, explanation: "Simple Past voice parameters map passive targets back to basic root active configurations[cite: 18]." },
  { id: 8, pdfNo: "Q.8", isWrongInPdf: false, question: "By whom was grammar taught to you?", options: ["Did he teach you grammar?", "Who had taught you grammar?", "You were taught grammar by whom?", "Who taught you grammar?"], answer: 3, explanation: "Interrogative passive introduced via 'By whom was...' maps to standard active 'Who taught...?'[cite: 18]." },
  { id: 9, pdfNo: "Q.9", isWrongInPdf: false, question: "The letter will be delivered by the postman tomorrow.", options: ["The postman delivered the letter tomorrow", "The postman will have delivered the letter tomorrow.", "The postman will deliver the letter tomorrow.", "The postman will be delivering the letter tomorrow."], answer: 2, explanation: "Future indefinite passive tracks directly to simple future active verb layout configurations[cite: 18]." },
  { id: 10, pdfNo: "Q.10", isWrongInPdf: false, question: "Historians tell us how this country was divided into three.", options: ["We are told by historians how this country has been divided into three.", "We are told by historians how this country divided into three.", "We are told by historians how this country was divided into three.", "We have been told by historians how this country was divided into three."], answer: 2, explanation: "Main clause stays in matching matrix format while preserving internal historical secondary passive parameters[cite: 18]." },
  { id: 11, pdfNo: "Q.11", isWrongInPdf: false, question: "The company will launch the new product next month, and they are already promoting it through various marketing channels.", options: ["The new product will be launched by the company next month, and it is already being promoted through various marketing channels.", "The new product were been launched by the company next month, and it already was promoting through various marketing channels.", "The new product was launched by the company next month, and it is already promoted through various marketing channels.", "The new product will have been launched by the company next month, and it was already being promoted through various marketing channels."], answer: 0, explanation: "Compound tracking rules transform both coordinated sub-clauses into matching active-to-passive conversions[cite: 18]." },
  { id: 12, pdfNo: "Q.12", isWrongInPdf: false, question: "The teachers of our school have already taken this training.", options: ["This training has already been taken by the teachers of our school.", "This training has been taken by the teachers of our school.", "This training has already been taken by the our school teachers.", "This training was already taken by the teachers of our school."], answer: 0, explanation: "Present perfect 'have taken' shifts layout into standard singular form passive 'has already been taken'[cite: 18]." },
  { id: 13, pdfNo: "Q.13", isWrongInPdf: false, question: "Ravi will play the match.", options: ["The match is played by Ravi.", "The match will have been played by Ravi.", "The match will be playing by Ravi.", "The match will be played by Ravi."], answer: 3, explanation: "Simple future updates into modal template passive form: 'will be played'[cite: 18]." },
  { id: 14, pdfNo: "Q.14", isWrongInPdf: false, question: "The letter was being typed by the secretary when the phone rang.", options: ["The secretary will type the letter when the phone rings.", "The secretary types the letter when the phone rings", "The secretary was typing the letter when the phone rang.", "The secretary is typing the letter when the phone rings."], answer: 2, explanation: "Past continuous passive 'was being typed' maps back directly to active past continuous 'was typing'[cite: 18]." },
  { id: 15, pdfNo: "Q.15", isWrongInPdf: false, question: "He must deliver pizza.", options: ["Pizza has to be delivered by him.", "Pizza have to be delivered by him.", "Pizza must be delivered by him.", "Pizza can be delivered by him."], answer: 2, explanation: "Preserve modal consistency: active 'must deliver' shifts directly into passive 'must be delivered'[cite: 18]." },
  { id: 16, pdfNo: "Q.16", isWrongInPdf: false, question: "Sonam does not like bananas.", options: ["Banana is not liked by Sonam.", "Bananas have not been liked by Sonam.", "Bananas are not liked by Sonam.", "Bananas had not been liked by Sonam."], answer: 2, explanation: "Plural subject 'Bananas' demands simple present plural matching verb parameters 'are not liked'[cite: 18]." },
  { id: 17, pdfNo: "Q.17", isWrongInPdf: false, question: "Someone has taken my secret diary.", options: ["My secret diary had been taken by someone.", "My secret diary has to be taken by someone.", "My secret diary has been taken by someone.", "My secret diary will have been taken by someone."], answer: 2, explanation: "Present perfect voice parameters shift 'has taken' safely into passive template form 'has been taken'[cite: 18]." },
  { id: 18, pdfNo: "Q.18", isWrongInPdf: false, question: "The drug pedlar was arrested by the narcotics team.", options: ["The narcotics team was arrested the drug pedlar.", "The narcotics team arrest the drug pedlar.", "The narcotics team arrested the drug pedlar.", "The narcotics team has arrested the drug pedlar."], answer: 2, explanation: "Simple past passive configuration 'was arrested' steps back into standard simple past active 'arrested'[cite: 18]." },
  { id: 19, pdfNo: "Q.19", isWrongInPdf: false, question: "Scientists were conducting experiments on the newly discovered species.", options: ["Experiments on the newly discovered species had been conducted by the scientists.", "The newly discovered species has been conducting experiments by scientists.", "The newly discovered species has been experimented on by scientists.", "Experiments were being conducted on the newly discovered species by scientists."], answer: 3, explanation: "Past continuous active updates to progressive passive: 'were being conducted'[cite: 18]." },
  { id: 20, pdfNo: "Q.20", isWrongInPdf: false, question: "I will never overlook this creativity.", options: ["This creativity will never be overlooked by me.", "This creativity will be overlooked by me.", "This creativity will being overlooked by me.", "This creativity will not never be overlooked by me."], answer: 0, explanation: "Future negative modal layout maps directly into passive setup: 'will never be overlooked'[cite: 18]." },
  { id: 21, pdfNo: "Q.21", isWrongInPdf: false, question: "Who invited you to this party?", options: ["By whom you are invited to this party?", "By whom are you invited to this party?", "By whom you were invited to this party?", "By whom were you invited to this party?"], answer: 3, explanation: "Simple past active interrogation matches with past passive structure 'By whom were you invited...?'[cite: 18]" },
  { id: 22, pdfNo: "Q.22", isWrongInPdf: false, question: "The team will announce the winner tomorrow.", options: ["The team will announce tomorrow the winner.", "The winner will announce tomorrow by the team.", "The winner will be announced by the team tomorrow.", "Tomorrow will be announced the winner by the team."], answer: 2, explanation: "Simple future setup switches seamlessly to passive standard template 'will be announced'[cite: 18]." },
  { id: 23, pdfNo: "Q.23", isWrongInPdf: false, question: "Don't let Dylan fool you!", options: ["Do not be fooled by Dylan.", "Do not ever be fooled by Dylan.", "Do not be fool by Dylan.", "Do not have been fooled by Dylan."], answer: 0, explanation: "Imperative negative shift maps closest to active intentional semantic equivalence: 'Do not be fooled by Dylan.'[cite: 18]" },
  { id: 24, pdfNo: "Q.24", isWrongInPdf: false, question: "The children have made the box.", options: ["The box is being made by the children.", "Children had made the box.", "The box had been made by the children.", "The box has been made by the children."], answer: 3, explanation: "Present perfect active transforms directly into present perfect passive structure layout[cite: 18]." },
  { id: 25, pdfNo: "Q.25", isWrongInPdf: false, question: "They are organising a concert for charity.", options: ["A concert is being organised by them for charity.", "They are organising a charity concert.", "They are being organised a concert for charity.", "A concert for charity is organising by them."], answer: 0, explanation: "Present progressive active shifts smoothly to progressive passive: 'is being organised'[cite: 18]." },
  { id: 26, pdfNo: "Q.26", isWrongInPdf: false, question: "Martha made pancakes yesterday.", options: ["Pancakes had been made by Martha yesterday.", "Pancakes were being made by Martha yesterday.", "Pancakes were made by Martha yesterday.", "Pancakes was made by Martha yesterday."], answer: 2, explanation: "Plural target units ('Pancakes') take matching plural past passive formats ('were made')[cite: 18]." },
  { id: 27, pdfNo: "Q.27", isWrongInPdf: false, question: "I will be gifted a fancy doll by them the next day.", options: ["They gifted me a fancy doll yesterday.", "They are gifting me a fancy doll the next day.", "They gift me a fancy doll the previous day.", "They will gift me a fancy doll tomorrow."], answer: 3, explanation: "Passive future construction maps closest back into standard active future options layout structures[cite: 18]." },
  { id: 28, pdfNo: "Q.28", isWrongInPdf: false, question: "He will give a lecture on personality development.", options: ["A lecture on personality development can be given by him.", "A lecture will be given on personality development.", "A lecture on personality development will be given by him.", "A lecture on personality development will be giving by him."], answer: 2, explanation: "Simple future maps smoothly into its corresponding model passive configuration: 'will be given'[cite: 18]." },
  { id: 29, pdfNo: "Q.29", isWrongInPdf: false, question: "His behaviour vexes me sometimes.", options: ["He is being vexing me with his behaviour.", "Sometimes he vexes me with his behaviour.", "I am sometimes vexed by his behaviour.", "His behaviour is vexed."], answer: 2, explanation: "Simple present configuration ('vexes') turns into present passive status layout 'I am sometimes vexed'[cite: 18]." },
  { id: 30, pdfNo: "Q.30", isWrongInPdf: false, question: "They are building a new hospital in the city.", options: ["A new hospital was built in the city by them.", "A new hospital has been built in the city by them.", "A new hospital will be built in the city by them.", "A new hospital is being built in the city by them."], answer: 3, explanation: "Present progressive matches directly with present continuous passive template elements[cite: 18]." },
  { id: 31, pdfNo: "Q.31", isWrongInPdf: false, question: "They have built a new bridge across the river.", options: ["A new bridge has been built across the river by them.", "A new bridge by them has been built across the river.", "A new bridge has built across the river by them.", "The river has been built a new bridge by them."], answer: 0, explanation: "Present perfect transformations securely follow regular past participle insertion criteria rules[cite: 18]." },
  { id: 32, pdfNo: "Q.32", isWrongInPdf: false, question: "By whom were you injured?", options: ["Who has injured you?", "Who injured you?", "Who had injured you?", "Who had been injuring you?"], answer: 1, explanation: "Past passive interrogation maps back directly into standard simple past active formats[cite: 18]." },
  { id: 33, pdfNo: "Q.33", isWrongInPdf: false, question: "Were the plants being grafted by the gardener?", options: ["Was the gardener grafting the plants?", "Was the gardener grafted the plants?", "Were the plants grafting the gardener?", "Were the gardener grafting the plants?"], answer: 0, explanation: "Past progressive passive updates back into matching singular active past continuous format options[cite: 18]." },
  { id: 34, pdfNo: "Q.34", isWrongInPdf: false, question: "Dipesh will send Rakesh away to college for certain reasons.", options: ["Rakesh will have to be sent away to college for certain reasons by Dipesh.", "Rakesh will be sent away to college for certain reasons by Dipesh.", "Rakesh would have been sent away to college for certain reasons by Dipesh.", "Rakesh would be sent away to college for certain reasons by Dipesh."], answer: 1, explanation: "Future indefinite template matches directly with basic future passive structures[cite: 18]." },
  { id: 35, pdfNo: "Q.35", isWrongInPdf: false, question: "Why are you repeatedly called by her?", options: ["Why she calls you repeatedly?", "Why had she called you repeatedly?", "Why was she calling you repeatedly?", "Why does she call you repeatedly?"], answer: 3, explanation: "Present passive interrogative maps safely back to simple present question forms tracking singular actor attributes[cite: 18]." },
  { id: 36, pdfNo: "Q.36", isWrongInPdf: false, question: "Can you compose an inspiring poem?", options: ["Can an inspiring poem be composed?", "An inspiring poem can be composed by you.", "Can an inspiring poem be composed by you?", "Can an inspiring poem by you composed?"], answer: 2, explanation: "Interrogative modal passive maintains identical starting token locations across updates[cite: 18]." },
  { id: 37, pdfNo: "Q.37", isWrongInPdf: false, question: "The tutor was not teaching the student.", options: ["The student was teaching the tutor.", "The student was not taught by the tutor.", "The student was not being taught by the tutor.", "The student was not being teaching by the tutor."], answer: 2, explanation: "Past progressive negative updates directly to progressive negative passive structural modules[cite: 18]." },
  { id: 38, pdfNo: "Q.38", isWrongInPdf: false, question: "People will respect his bravado.", options: ["His bravado will being respected by people.", "His bravado will have to be respected by people.", "His bravado will be respected by people.", "His bravado will be respect by people."], answer: 2, explanation: "Future active voice switches into clean future passive layout configurations safely[cite: 18]." },
  { id: 39, pdfNo: "Q.39", isWrongInPdf: false, question: "People know Stellenbosch for its greenery and delicious street foods.", options: ["Stellenbosch was known to people for its greenery and delicious street foods.", "Stellenbosch is known to people for its greenery and delicious street foods.", "Stellenbosch had been known to people for its greenery and delicious street foods.", "Stellenbosch have been known to people for its greenery and delicious street foods"], answer: 1, explanation: "Simple present base maps to present passive, utilizing the accurate trailing preposition link element 'known to'[cite: 18]." },
  { id: 40, pdfNo: "Q.40", isWrongInPdf: false, question: "The cashier had finished the assigned task on time.", options: ["The assigned task is finished by the cashier on time.", "The assigned task has been finished by the cashier on time.", "The assigned task had been finished by the cashier on time.", "The assigned task was finished by the cashier on time."], answer: 2, explanation: "Past perfect active maps strictly to its corresponding past perfect passive template layout configuration[cite: 18]." },
  { id: 41, pdfNo: "Q.41", isWrongInPdf: false, question: "Data is being collected by the researcher.", options: ["The researcher has collected data.", "The researcher is collecting data.", "The researcher has been collecting data.", "The researcher will be collecting data."], answer: 1, explanation: "Present continuous passive maps straight back into active present progressive patterns[cite: 18]." },
  { id: 42, pdfNo: "Q.42", isWrongInPdf: false, question: "The concert tickets were bought by my friend", options: ["My friend has bought the concert tickets.", "My friend bought the concert tickets.", "My friend buys the concert tickets.", "My friend is buying the concert tickets."], answer: 1, explanation: "Simple past passive layout elements transform back cleanly into active simple past inflections[cite: 18]." },

let startBound = 0;
let endBound = QUESTIONS.length - 1;
let currentIdx = 0;
let userAnswers = {};
let timerSeconds = 0;
let quizMode = false;
let timerObj;

function selectQuizPart(startQ, endQ) {
  startBound = startQ - 1;
  endBound = endQ - 1;
  currentIdx = startBound;
  userAnswers = {};
  
  document.getElementById('partSelectModal').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('footerBar').style.display = 'flex';
  
  init();
}

function init() {
  renderQuestion();
  if(!timerObj) {
    startClock();
  }
  setupPalette();
}

function renderQuestion() {
  const q = QUESTIONS[currentIdx];
  const qIndexSpan = document.getElementById('qindex');
  const qBadgeSpan = document.getElementById('qbadge');
  
  // Set custom PDF Question numbering format
  qIndexSpan.innerText = q.pdfNo;
  
  // Apply visual red highlight if the question contains an SSC mistake
  if (q.isWrongInPdf) {
    qIndexSpan.className = "wrong-marked";
    qBadgeSpan.innerHTML = `<span class="wrong-badge">🔴 SSC Wrong Ans Key</span>`;
  } else {
    qIndexSpan.className = "";
    qBadgeSpan.innerHTML = "";
  }
  
  document.getElementById('qtext').innerHTML = `<strong>${q.question}</strong>`;
  document.getElementById('marking').innerHTML = `Marking: <span style="color:var(--success)">+2.00</span> / <span style="color:var(--danger)">-0.50</span>`;
  
  const optContainer = document.getElementById('options');
  const expContainer = document.getElementById('explanation');
  optContainer.innerHTML = "";
  expContainer.style.display = "none";

  q.options.forEach((txt, i) => {
    const div = document.createElement('div');
    div.className = 'opt' + (userAnswers[currentIdx] === i ? ' selected' : '');
    div.innerHTML = `<span>${String.fromCharCode(65 + i)}.</span> ${txt}`;
    div.onclick = () => { userAnswers[currentIdx] = i; renderQuestion(); updatePalette(); };
    optContainer.appendChild(div);
  });
  if (quizMode && userAnswers[currentIdx] !== undefined) showFeedback();
}

function showFeedback() {
  const q = QUESTIONS[currentIdx];
  const opts = document.getElementById('options').children;
  const exp = document.getElementById('explanation');
  Array.from(opts).forEach((el, i) => {
    el.classList.remove('correct', 'wrong');
    if (i === q.answer) el.classList.add('correct');
    else if (i === userAnswers[currentIdx]) el.classList.add('wrong');
  });
  exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
  if(q.isWrongInPdf) {
    exp.style.borderLeft = "4px solid #d9383a";
    exp.style.background = "#fff5f5";
  } else {
    exp.style.borderLeft = "4px solid var(--accent)";
    exp.style.background = "#f0f7f7";
  }
  exp.style.display = "block";
}

function startClock() {
  timerSeconds = 0;
  timerObj = setInterval(() => {
    timerSeconds++;
    const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const s = (timerSeconds % 60).toString().padStart(2, '0');
    document.getElementById('timer').innerText = `${m}:${s}`;
  }, 1000);
}

function setupPalette() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement('button');
    b.className = 'qbtn';
    b.innerText = q.pdfNo.replace("Q.", "").replace("Q", "");
    
    if (q.isWrongInPdf) {
      b.style.borderColor = "#d9383a";
      b.style.color = "#d9383a";
    }
    
    // Grey out questions not inside the chosen sheet limits
    if (i < startBound || i > endBound) {
      b.style.opacity = "0.2";
      b.style.pointerEvents = "none";
    } else {
      b.onclick = () => { currentIdx = i; renderQuestion(); document.getElementById('palette').style.display = 'none'; };
    }
    grid.appendChild(b);
  });
  updatePalette();
}

function updatePalette() {
  const btns = document.getElementById('paletteGrid').children;
  let attempted = 0;
  Array.from(btns).forEach((b, i) => {
    b.classList.remove('current', 'answered');
    if (i === currentIdx) b.classList.add('current');
    if (userAnswers[i] !== undefined) { 
      b.classList.add('answered'); 
      if (i >= startBound && i <= endBound) attempted++; 
    }
  });
  const totalInSegment = (endBound - startBound) + 1;
  document.getElementById('palette-summary').innerText = `Sheet Questions: ${totalInSegment} | Attempted: ${attempted}`;
}

document.getElementById('nextBtn').onclick = () => { if (currentIdx < endBound) { currentIdx++; renderQuestion(); updatePalette(); } };
document.getElementById('prevBtn').onclick = () => { if (currentIdx > startBound) { currentIdx--; renderQuestion(); updatePalette(); } };
document.getElementById('clearBtn').onclick = () => { delete userAnswers[currentIdx]; renderQuestion(); updatePalette(); };
document.getElementById('paletteBtn').onclick = () => { 
  const p = document.getElementById('palette');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  updatePalette();
};
document.getElementById('modeToggle').onclick = function() { this.classList.toggle('active'); quizMode = !quizMode; renderQuestion(); };
document.getElementById('submitBtn').onclick = () => { 
  let attempted = 0;
  for (let i = startBound; i <= endBound; i++) {
    if (userAnswers[i] !== undefined) attempted++;
  }
  const totalInSegment = (endBound - startBound) + 1;
  document.getElementById('submitMsg').innerText = `You have attempted ${attempted} out of ${totalInSegment} questions from this sheet.`;
  document.getElementById('submitModal').style.display = 'flex'; 
};
document.getElementById('cancelSubmit').onclick = () => { document.getElementById('submitModal').style.display = 'none'; };
document.getElementById('confirmSubmit').onclick = () => { clearInterval(timerObj); timerObj = null; document.getElementById('submitModal').style.display = 'none'; showResults(); };

function showResults() {
  let correct = 0;
  let reviewHTML = `<div class="card"><h2 style="text-align:center; color:var(--accent)">Review & Answer Key</h2>`;

  for (let i = startBound; i <= endBound; i++) {
    const q = QUESTIONS[i];
    const isCorrect = userAnswers[i] === q.answer;
    if (isCorrect) correct++;
    const statusText = userAnswers[i] === undefined ? '<span style="color:var(--muted)">Unattempted</span>' : (isCorrect ? '<span style="color:var(--success); font-weight:bold">Correct</span>' : '<span style="color:var(--danger); font-weight:bold">Wrong</span>');
    const redLabel = q.isWrongInPdf ? ` <span style="color:#d9383a; font-weight:bold;">[🔴 SSC Key Error]</span>` : "";

    reviewHTML += `
      <div class="review-q">
        <p><strong class="${q.isWrongInPdf ? 'wrong-marked' : ''}">${q.pdfNo}. ${q.question}</strong> (${statusText})${redLabel}</p>
        <div>
          ${q.options.map((opt, optIdx) => {
            let bgColor = "transparent"; let borderColor = "#eee";
            if (optIdx === q.answer) { bgColor = "#e8f5e9"; borderColor = "#4caf50"; }
            else if (optIdx === userAnswers[i]) { bgColor = "#ffebee"; borderColor = "#f44336"; }
            return `<div class="review-opt" style="border:1px solid ${borderColor}; background:${bgColor}; padding:8px; margin:4px 0; border-radius:5px;">${String.fromCharCode(65 + optIdx)}. ${opt} ${optIdx === q.answer ? '✅' : (optIdx === userAnswers[i] ? '❌' : '')}</div>`;
          }).join('')}
        </div>
        <div style="margin-top:10px; font-size:14px; background:${q.isWrongInPdf ? '#fff5f5' : '#f9f9f9'}; padding:8px; border-radius:5px; border-left:3px solid ${q.isWrongInPdf ? '#d9383a' : 'var(--accent)'};">
          <strong>Explanation:</strong> ${q.explanation}
        </div>
      </div>`;
  }

  let attempted = 0;
  for (let i = startBound; i <= endBound; i++) { if (userAnswers[i] !== undefined) attempted++; }
  const wrong = attempted - correct;
  const score = (correct * 2) - (wrong * 0.5);
  
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('footerBar').style.display = 'none';
  const res = document.getElementById('results');
  res.style.display = 'block';
  res.innerHTML = `
    <div class="card">
      <h2 style="text-align:center; color:var(--accent)">Results Summary (Current Sheet)</h2>
      <div class="stats-grid">
        <div class="stat-box"><h4>Score</h4><p>${score.toFixed(2)}</p></div>
        <div class="stat-box"><h4>Correct</h4><p>${correct}</p></div>
        <div class="stat-box"><h4>Wrong</h4><p>${wrong}</p></div>
        <div class="stat-box"><h4>Time</h4><p>${document.getElementById('timer').innerText}</p></div>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
        <button class="btn" onclick="downloadResult()">Download Result</button>
        <button class="btn" style="background:#6c757d" onclick="window.location.reload();">Main Menu / Retry</button>
      </div>
    </div>
    ${reviewHTML}
  `;
}

function downloadResult() {
    const resultsContent = document.getElementById('results').innerHTML;
    const blob = new Blob([`<html><head><style>body{font-family:sans-serif; padding:20px;} .card{border:1px solid #ddd; padding:20px; border-radius:10px; margin-bottom:10px;} .stats-grid{display:flex; gap:20px;} .review-opt{padding:5px; margin:2px; border:1px solid #eee; border-radius:5px;} .wrong-marked{color:#d9383a !important;}</style></head><body>${resultsContent}</body></html>`], {type: 'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Voice_Exam_Scorecard.html'; a.click();
}
