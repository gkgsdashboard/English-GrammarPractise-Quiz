<style>
:root{
  --accent:#2ec4b6;
  --accent-dark:#1da89a;
  --muted:#69707a;
  --success:#1f9e5a;
  --danger:#c82d3f;
  --bg:#f5f7fa;
  --card:#fff;
  --maxw:820px;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#111;padding-bottom:120px}
.container{max-width:var(--maxw);margin:auto;padding:10px 16px}
header{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.08);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:12px}
h1{margin:0;color:var(--accent);font-size:18px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent-dark)}
.btn-ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);padding:8px 12px;border-radius:999px;font-weight:700;cursor:pointer}
.timer-text{color:var(--accent-dark);font-weight:700;font-size:18px;min-width:72px;text-align:right}
.toggle-pill{position:relative;width:90px;height:30px;background:#eaeef0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:13px;color:#444;font-weight:600}
.toggle-pill span{z-index:2;flex:1;text-align:center;pointer-events:none}
.toggle-pill::before{content:"";position:absolute;top:3px;left:3px;width:42px;height:24px;background:var(--accent);border-radius:999px;transition:.28s}
.toggle-pill.active::before{transform:translateX(45px);background:var(--accent-dark)}
.toggle-pill.active span:last-child{color:#fff}
.toggle-pill span:first-child{color:#fff}
.card{background:var(--card);border-radius:10px;padding:15px;margin:12px 0;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qmeta, .marking{font-size:13px;color:var(--muted)}
.qtext{font-size:16px;margin-bottom:15px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:10px}
.opt{padding:12px;border:1px solid #e6eaec;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent)}
.opt.selected{border:2px solid var(--accent)}
.opt.correct{border:2px solid var(--success);background:rgba(31,158,90,0.1)}
.opt.wrong{border:2px solid var(--danger);background:rgba(200,45,63,0.1)}
.fbar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -3px 12px rgba(0,0,0,0.08);display:flex;justify-content:center;z-index:50}
.fbar-inner{display:flex;justify-content:center;gap:15px;width:100%;padding:15px}

/* SCROLLABLE PALETTE */
#palette{position:fixed;top:70px;right:20px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.15);padding:15px;display:none;flex-direction:column;z-index:200;max-width:280px;max-height:70vh;}
.palette-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;overflow-y:auto;padding-right:5px;}
.qbtn{width:40px;height:40px;border-radius:6px;border:1px solid #ddd;cursor:pointer;font-weight:bold;flex-shrink:0;}
.qbtn.answered{background:var(--accent);color:white;border:none}
.qbtn.current{border:2px solid var(--accent);background:rgba(46,196,182,0.1)}
#palette-summary{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid #eee;padding-top:8px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:300}
.modal-content{background:#fff;padding:25px;border-radius:12px;text-align:center;width:90%;max-width:420px}
.explanation{margin-top:15px;padding:12px;background:#f0f7f7;border-radius:8px;display:none;font-size:14px;border-left:4px solid var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));gap:10px;margin-bottom:20px}
.stat-box{background:#f8fafb;padding:10px;border-radius:8px;border:1px solid #eef1f2;text-align:center}
.stat-box h4{margin:0;font-size:12px;color:var(--muted)}
.stat-box p{margin:5px 0 0;font-weight:bold;font-size:18px;color:var(--accent)}
.review-q{border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px;}
.review-opt{padding: 8px; margin: 4px 0; border-radius: 5px; font-size: 14px;}

.part-btn {
  display: block; width: 100%; background: #f0f4f8; border: 1px solid #dcdfe4; padding: 12px;
  margin: 10px 0; border-radius: 8px; text-align: left; font-size: 14px; cursor: pointer; font-weight: 600;
}
.part-btn:hover { background: var(--accent); color: white; border-color: var(--accent-dark); }

.wrong-marked { color: #d9383a !important; font-weight: bold; }
.wrong-badge { background: #ffebeb; color: #d9383a; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 8px; border: 1px solid #fabadc; }
.cat-header { background: #eef2f7; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; color: var(--muted); margin-bottom: 10px; display: inline-block; }
</style>

<script>
let startBound = 0;
let endBound = 0;
let currentIdx = 0;
let userAnswers = {};
let timerSeconds = 0;
let quizMode = false;
let timerObj;

const QUESTIONS = [
  /* =========================================================
     SHEET 1: NARRATION PRACTICE SHEET (Q1 - Q97)[cite: 21]
     ========================================================= */
  { id: 1, pdfNo: "Q1", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "Ravi said, \"I like this pen.\"", options: ["Ravi said he liked that pen.", "Ravi said he like that pen.", "Ravi said he liked this pen.", "Ravi said he likes that pen."], answer: 0, explanation: "Simple present ('like') changes to Simple past ('liked') and 'this' changes to 'that'[cite: 21]." },
  { id: 2, pdfNo: "Q2", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said, \"It may rain today.\"", options: ["He said it might rain that day.", "He said it may rain that day.", "He said it can rain today.", "He said it might raining today."], answer: 0, explanation: "Modal 'may' changes to 'might' and temporal adverb 'today' updates to 'that day'[cite: 21]." },
  { id: 3, pdfNo: "Q3", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"I can play the piano.\"", options: ["She said she could play the piano.", "She said she can play piano.", "She told she could played piano.", "She said she might play piano."], answer: 0, explanation: "'can' changes to 'could' followed by base verb form 'play'[cite: 21]." },
  { id: 4, pdfNo: "Q4", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"I can solve this problem.\"", options: ["She said that she will solve that problem.", "She said that she could solve this problem.", "She said that she could solve that problem.", "She said she can solve the problem."], answer: 2, explanation: "'can' changes to 'could' and 'this' updates to 'that'[cite: 21]." },
  { id: 5, pdfNo: "Q5", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "The teacher said, \"Who can solve this question?\"", options: ["The teacher asked who could solve that question.", "The teacher asked who can solve that question.", "The teacher said who could solve this question.", "The teacher asked to solve that question."], answer: 0, explanation: "Interrogative syntax switches to assertive sequence, 'this' changes to 'that'[cite: 21]." },
  { id: 6, pdfNo: "Q6", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "Rita said, \"I haven't eaten anything.\"", options: ["Rita said that she didn't eat anything.", "Rita said that she hasn't eaten anything.", "Rita said that she hadn't eaten anything.", "Rita said that she wasn't eating anything."], answer: 2, explanation: "Present perfect negative ('haven't eaten') updates into past perfect negative ('hadn't eaten')[cite: 21]." },
  { id: 7, pdfNo: "Q7", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"I saw him last night.\"", options: ["She said she had seen him the previous night.", "She said she has seen him last night.", "She said she was seeing him last night.", "She said she had saw him the previous night."], answer: 0, explanation: "Simple past ('saw') steps back into past perfect ('had seen') and 'last night' transforms to 'the previous night'[cite: 21]." },
  { id: 8, pdfNo: "Q8", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said, \"I bought a new laptop.\"", options: ["He said that he had bought a new laptop.", "He said that he buys a new laptop.", "He said that he was buying a new laptop.", "He said that he has bought a new laptop."], answer: 0, explanation: "Simple past active turns into past perfect template 'had bought'[cite: 21]." },
  { id: 9, pdfNo: "Q9", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "Rohit said, \"I had completed the project.\"", options: ["Rohit said he has completed the project.", "Rohit said he completed the project.", "Rohit said that he had completed the project.", "Rohit said that he was completing the project."], answer: 2, explanation: "Past perfect aspect markers ('had completed') remain unaltered across conversion matrices[cite: 21]." },
  { id: 10, pdfNo: "Q10", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"I had completed the report.\"", options: ["She said that she completed the report.", "She said that she has completed the report.", "She said that she had completed the report.", "She said she had been completing the report."], answer: 2, explanation: "Past perfect tense parameters undergo no auxiliary changes inside reported structures[cite: 21]." },
  { id: 11, pdfNo: "Q11", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"I had already finished the work.\"", options: ["She said she already finished the work.", "She said that she had already finished the work.", "She said she has already finished the work.", "She said that she would finish the work."], answer: 1, explanation: "Past perfect retains its auxiliary properties identical to direct speech constraints[cite: 21]." },
  { id: 12, pdfNo: "Q12", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "The director noted that the figures had been inflated.", options: ["The director said, \"These figures have been inflated.\"", "The director said, \"The figures are inflated.\"", "The director said, \"The figures were inflated.\"", "The director said, \"They inflated the figures.\""], answer: 0, explanation: "Indirect past perfect passive maps back smoothly to present perfect passive ('have been inflated') with 'these'[cite: 21]." },
  { id: 13, pdfNo: "Q13", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "The manager informed the employees that the deadline for submission had been extended by two days.", options: ["\"You may submit the work two days later than planned,\" the manager informed.", "\"The deadline has been extended by two days,\" said the manager.", "\"We are extending the submission deadline by two days,\" the manager said.", "\"You must finish it within two extra days,\" the manager said."], answer: 1, explanation: "Past perfect passive reporting traces straight back to direct present perfect passive structures[cite: 21]." },
  { id: 14, pdfNo: "Q14", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"I was very tired yesterday.\"", options: ["She said she had been very tired the day before.", "She said she was very tired yesterday.", "She said she had been very tired yesterday.", "She said she is very tired the day before."], answer: 0, explanation: "Simple past link state ('was') moves back to past perfect 'had been' and 'yesterday' changes to 'the day before'[cite: 21]." },
  { id: 15, pdfNo: "Q15", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"I am feeling cold.\"", options: ["She said she is feeling cold.", "She said she was feeling cold.", "She said she felt cold.", "She said she had felt cold."], answer: 1, explanation: "Present continuous progressive changes to past continuous sequence 'was feeling'[cite: 21]." },
  { id: 16, pdfNo: "Q16", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said, \"I am reading a book.\"", options: ["He said he is reading a book.", "He said that he was reading a book.", "He said that he had read a book.", "He said he read a book."], answer: 1, explanation: "Present progressive 'am reading' maps onto past progressive structural layout 'was reading'[cite: 21]." },
  { id: 17, pdfNo: "Q17", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said, \"I am not feeling well.\"", options: ["He said that he is not feeling well.", "He said that he was not feeling well.", "He said that he didn't felt well.", "He said he not feeling well."], answer: 1, explanation: "Present continuous negative shifts seamlessly into past progressive negative formats[cite: 21]." },
  { id: 18, pdfNo: "Q18", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said, \"What are you doing?\"", options: ["He asked what are you doing.", "He asked what I had been doing.", "He asked what was I doing.", "He asked what I was doing."], answer: 3, explanation: "Interrogative present progressive turns into standard assertive past progressive sequence 'what I was doing'[cite: 21]." },
  { id: 19, pdfNo: "Q19", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "They said, \"We are going on a trip.\"", options: ["They said they are going on a trip.", "They said they were going on a trip.", "They said they went on a trip.", "They said they had going on a trip."], answer: 1, explanation: "Present progressive plural active shifts directly to past continuous plural 'were going'[cite: 21]." },
  { id: 20, pdfNo: "Q20", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "I said, \"Why are you crying?\"", options: ["I asked why he was crying.", "I said why are you crying.", "I told why you cried.", "I asked why he cried."], answer: 0, explanation: "Interrogative progressive tracking updates onto descriptive past continuous assertive forms[cite: 21]." },
  { id: 21, pdfNo: "Q21", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"I was reading a novel at that time.\"", options: ["She said she had been reading a novel at that time.", "She said she read a novel at that time.", "She said she had read a novel at that time.", "She said she was reading a novel then."], answer: 0, explanation: "Past continuous structural configurations ('was reading') update into past perfect continuous templates ('had been reading')[cite: 21]." },
  { id: 22, pdfNo: "Q22", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She mentioned that she was working on a classified project.", options: ["She said, \"I work on a classified project.\"", "She said, \"I am working on a classified project.\"", "She said, \"I had worked on a classified project.\"", "She said, \"I will work on a classified project.\""], answer: 1, explanation: "Past continuous indirect statements map back into direct present progressive layout systems[cite: 21]." },
  { id: 23, pdfNo: "Q23", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "The scientist said, \"We have been working on this project for months.\"", options: ["The scientist said they had been working on that project for months.", "The scientist said they have been working on this project for months.", "The scientist said that they were working on that project.", "The scientist said that we had worked on this project."], answer: 0, explanation: "Present perfect continuous shifts into past perfect continuous 'had been working' and 'this' turns to 'that'[cite: 21]." },
  { id: 24, pdfNo: "Q24", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said, \"How long have you been waiting?\"", options: ["He asked how long had I been waiting.", "He said how long I was waiting.", "He asked how long I have been waiting.", "He asked how long I had been waiting."], answer: 3, explanation: "Interrogative present perfect continuous requires standard assertive past perfect continuous ordering 'how long I had been waiting'[cite: 21]." },
  { id: 25, pdfNo: "Q25", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "The teacher said, \"Be quiet in the class.\"", options: ["The teacher told be quiet in the class.", "The teacher told them to quiet in the class.", "The teacher said them to be quiet in the class.", "The teacher told them to be quiet in the class."], answer: 3, explanation: "Imperative commands map onto appropriate reporting structures using 'told them + to-infinitive'[cite: 21]." },
  { id: 26, pdfNo: "Q26", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "Father said, \"Don't speak loudly.\"", options: ["Father said don't speak loudly.", "Father told me not to speak loudly.", "Father asked not to speak loudly.", "Father said to me not speaking loudly."], answer: 1, explanation: "Negative imperative constraints convert cleanly using the directive format 'told me not to + V1'[cite: 21]." },
  { id: 27, pdfNo: "Q27", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said to me, \"Open the window.\"", options: ["She told me open the window.", "She told me to open the window.", "She told me opening the window.", "She said me to open the window."], answer: 1, explanation: "Direct orders use an infinitive noun link particle 'to open' after reporting changes[cite: 21]." },
  { id: 28, pdfNo: "Q28", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said that he wished to speak with the manager.", options: ["\"I wish to speak with the manager,\" he said.", "\"I want to speak with the manager,\" he said.", "\"I wished to speak with the manager,\" he said.", "\"May I speak with the manager?\" he said."], answer: 0, explanation: "Indirect simple past assertions map straight back to simple present intentional declarations[cite: 21]." },
  { id: 29, pdfNo: "Q29", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said, \"You must work hard.\"", options: ["He said I must work hard.", "He said that I had to work hard.", "He said that you must work hard.", "He said that I have to work hard."], answer: 1, explanation: "The modal 'must' denoting absolute current necessity maps into the historical past format obligation 'had to'[cite: 21]." },
  { id: 30, pdfNo: "Q30", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "I said, \"He will be here by noon.\"", options: ["I said he will be there by noon.", "I said that he would be here by noon.", "I said that he would be there by noon.", "I said he shall be there by noon."], answer: 2, explanation: "Modal future 'will' becomes past conditional 'would' and place adverb 'here' updates to 'there'[cite: 21]." },
  { id: 31, pdfNo: "Q31", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"My parents will arrive today.\"", options: ["She said that her parents will arrive that day.", "She said her parents would arrive today.", "She said that her parents would arrive that day.", "She said her parents would be arriving today."], answer: 2, explanation: "Modal 'will' shifts to 'would' and temporal barrier 'today' converts to 'that day'[cite: 21]." },
  { id: 32, pdfNo: "Q32", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "John said, \"I shall return soon.\"", options: ["John said he will return soon.", "John said he would return soon.", "John said he shall return soon.", "John said he returns soon."], answer: 1, explanation: "First person future indicator 'shall' updates to third person perspective conditional 'would'[cite: 21]." },
  { id: 33, pdfNo: "Q33", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "They said, \"We shall overcome this challenge together.\"", options: ["They said they will overcome that challenge together.", "They said they should overcome this challenge together.", "They said they would overcome that challenge together.", "They said they shall overcome that challenge together."], answer: 2, explanation: "Collective future resolution tracking updates into past conditional matching layout 'would' with 'that'[cite: 21]." },
  { id: 34, pdfNo: "Q34", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"He doesn't listen to me.\"", options: ["She said he don't listen to her.", "She said that he doesn't listened to her.", "She said that he didn't listen to her.", "She said that he didn't listened to her."], answer: 2, explanation: "Simple present negative ('doesn't listen') transforms into past simple negative ('didn't listen')[cite: 21]." },
  { id: 35, pdfNo: "Q35", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "She said, \"I didn't see him at the station.\"", options: ["She said that she hasn't seen him at the station.", "She said that she had not seen him at the station.", "She said she didn't saw him at the station.", "She said that she was not seeing him at the station."], answer: 1, explanation: "Negative simple past ('didn't see') steps back into negative past perfect 'had not seen'[cite: 21]." },
  { id: 36, pdfNo: "Q36", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said, \"I have seen that movie already.\"", options: ["He said that he saw that movie already.", "He said that he had seen that movie already.", "He said that he have seen that movie already.", "He said that he was seeing that movie already."], answer: 1, explanation: "Present perfect markers ('have seen') transform securely into past perfect layouts 'had seen'[cite: 21]." },
  { id: 37, pdfNo: "Q37", cat: "Sheet 1: Easy Questions", isWrongInPdf: false, question: "He said, \"The sun rises in the east.\"", options: ["He said that the sun rose in the east.", "He said that the sun has risen in the east.", "He said that the sun rises in the east.", "He said that the sun had risen in the east."], answer: 2, explanation: "Universal geographical truths or permanent natural facts keep their simple present layout unaltered[cite: 21]." },

  { id: 94, pdfNo: "Q94", cat: "Sheet 1: Challenge Type Questions 🔴", isWrongInPdf: true, question: "The composer explained that, were the leitmotif transposed an octave higher, the tension might dissipate prematurely.", options: ["The composer said, \"If the leitmotif was transposed an octave higher, the tension will dissipate prematurely.\"", "The composer said, \"Were the leitmotif transposed an octave higher, the tension might dissipate prematurely.\"", "The composer said, \"The tension will dissipate prematurely if the leitmotif had been transposed an octave higher.\"", "The composer said, \"Had the leitmotif been transposed an octave higher, the tension must have dissipated prematurely.\""], answer: 1, explanation: "🔴 SSC CONFLICT NOTE: The exact conditional matching token configuration targets layout choice (b)[cite: 21]." },

function selectQuizPart(startQ, endQ) {
  startBound = startQ - 1;
  endBound = endQ - 1;
  currentIdx = startBound;
  userAnswers = {};
  
  document.getElementById('partSelectModal').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('footerBar').style.display = 'flex';
  
  init();
}

function init() {
  renderQuestion();
  if(!timerObj) {
    startClock();
  }
  setupPalette();
}

function renderQuestion() {
  const q = QUESTIONS[currentIdx];
  const qIndexSpan = document.getElementById('qindex');
  const qBadgeSpan = document.getElementById('qbadge');
  
  qIndexSpan.innerText = q.pdfNo;
  document.getElementById('qcat').innerText = q.cat || "Narration Practice";
  
  if (q.isWrongInPdf) {
    qIndexSpan.className = "wrong-marked";
    qBadgeSpan.innerHTML = `<span class="wrong-badge">🔴 SSC Key Error</span>`;
  } else {
    qIndexSpan.className = "";
    qBadgeSpan.innerHTML = "";
  }
  
  document.getElementById('qtext').innerHTML = `<strong>${q.question}</strong>`;
  document.getElementById('marking').innerHTML = `Marking: <span style="color:var(--success)">+2.00</span> / <span style="color:var(--danger)">-0.50</span>`;
  
  const optContainer = document.getElementById('options');
  const expContainer = document.getElementById('explanation');
  optContainer.innerHTML = "";
  expContainer.style.display = "none";

  q.options.forEach((txt, i) => {
    const div = document.createElement('div');
    div.className = 'opt' + (userAnswers[currentIdx] === i ? ' selected' : '');
    div.innerHTML = `<span>${String.fromCharCode(65 + i)}.</span> ${txt}`;
    div.onclick = () => { userAnswers[currentIdx] = i; renderQuestion(); updatePalette(); };
    optContainer.appendChild(div);
  });
  if (quizMode && userAnswers[currentIdx] !== undefined) showFeedback();
}

function showFeedback() {
  const q = QUESTIONS[currentIdx];
  const opts = document.getElementById('options').children;
  const exp = document.getElementById('explanation');
  Array.from(opts).forEach((el, i) => {
    el.classList.remove('correct', 'wrong');
    if (i === q.answer) el.classList.add('correct');
    else if (i === userAnswers[currentIdx]) el.classList.add('wrong');
  });
  exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
  if(q.isWrongInPdf) {
    exp.style.borderLeft = "4px solid #d9383a";
    exp.style.background = "#fff5f5";
  } else {
    exp.style.borderLeft = "4px solid var(--accent)";
    exp.style.background = "#f0f7f7";
  }
  exp.style.display = "block";
}

function startClock() {
  timerSeconds = 0;
  timerObj = setInterval(() => {
    timerSeconds++;
    const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const s = (timerSeconds % 60).toString().padStart(2, '0');
    document.getElementById('timer').innerText = `${m}:${s}`;
  }, 1000);
}

function setupPalette() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement('button');
    b.className = 'qbtn';
    b.innerText = q.pdfNo.replace("Q.", "").replace("Q", "").replace("Mains_", "M");
    
    if (q.isWrongInPdf) {
      b.style.borderColor = "#d9383a";
      b.style.color = "#d9383a";
    }
    
    if (i < startBound || i > endBound) {
      b.style.opacity = "0.2";
      b.style.pointerEvents = "none";
    } else {
      b.onclick = () => { currentIdx = i; renderQuestion(); document.getElementById('palette').style.display = 'none'; };
    }
    grid.appendChild(b);
  });
  updatePalette();
}

function updatePalette() {
  const btns = document.getElementById('paletteGrid').children;
  let attempted = 0;
  Array.from(btns).forEach((b, i) => {
    b.classList.remove('current', 'answered');
    if (i === currentIdx) b.classList.add('current');
    if (userAnswers[i] !== undefined) { 
      b.classList.add('answered'); 
      if (i >= startBound && i <= endBound) attempted++; 
    }
  });
  const totalInSegment = (endBound - startBound) + 1;
  document.getElementById('palette-summary').innerText = `Sheet Questions: ${totalInSegment} | Attempted: ${attempted}`;
}

document.getElementById('nextBtn').onclick = () => { if (currentIdx < endBound) { currentIdx++; renderQuestion(); updatePalette(); } };
document.getElementById('prevBtn').onclick = () => { if (currentIdx > startBound) { currentIdx--; renderQuestion(); updatePalette(); } };
document.getElementById('clearBtn').onclick = () => { delete userAnswers[currentIdx]; renderQuestion(); updatePalette(); };
document.getElementById('paletteBtn').onclick = () => { 
  const p = document.getElementById('palette');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  updatePalette();
};
document.getElementById('modeToggle').onclick = function() { this.classList.toggle('active'); quizMode = !quizMode; renderQuestion(); };
document.getElementById('submitBtn').onclick = () => { 
  let attempted = 0;
  for (let i = startBound; i <= endBound; i++) {
    if (userAnswers[i] !== undefined) attempted++;
  }
  const totalInSegment = (endBound - startBound) + 1;
  document.getElementById('submitMsg').innerText = `You have attempted ${attempted} out of ${totalInSegment} questions from this sheet.`;
  document.getElementById('submitModal').style.display = 'flex'; 
};
document.getElementById('cancelSubmit').onclick = () => { document.getElementById('submitModal').style.display = 'none'; };
document.getElementById('confirmSubmit').onclick = () => { clearInterval(timerObj); timerObj = null; document.getElementById('submitModal').style.display = 'none'; showResults(); };

function showResults() {
  let correct = 0;
  let reviewHTML = `<div class="card"><h2 style="text-align:center; color:var(--accent)">Review & Answer Key</h2>`;

  for (let i = startBound; i <= endBound; i++) {
    const q = QUESTIONS[i];
    const isCorrect = userAnswers[i] === q.answer;
    if (isCorrect) correct++;
    const statusText = userAnswers[i] === undefined ? '<span style="color:var(--muted)">Unattempted</span>' : (isCorrect ? '<span style="color:var(--success); font-weight:bold">Correct</span>' : '<span style="color:var(--danger); font-weight:bold">Wrong</span>');
    const redLabel = q.isWrongInPdf ? ` <span style="color:#d9383a; font-weight:bold;">[🔴 SSC Key Error]</span>` : "";

    reviewHTML += `
      <div class="review-q">
        <p><strong class="${q.isWrongInPdf ? 'wrong-marked' : ''}">${q.pdfNo}. ${q.question}</strong> (${statusText})${redLabel}</p>
        <div class="cat-header" style="margin-top:2px;">${q.cat}</div>
        <div>
          ${q.options.map((opt, optIdx) => {
            let bgColor = "transparent"; let borderColor = "#eee";
            if (optIdx === q.answer) { bgColor = "#e8f5e9"; borderColor = "#4caf50"; }
            else if (optIdx === userAnswers[i]) { bgColor = "#ffebee"; borderColor = "#f44336"; }
            return `<div class="review-opt" style="border:1px solid ${borderColor}; background:${bgColor}; padding:8px; margin:4px 0; border-radius:5px;">${String.fromCharCode(65 + optIdx)}. ${opt} ${optIdx === q.answer ? '✅' : (optIdx === userAnswers[i] ? '❌' : '')}</div>`;
          }).join('')}
        </div>
        <div style="margin-top:10px; font-size:14px; background:${q.isWrongInPdf ? '#fff5f5' : '#f9f9f9'}; padding:8px; border-radius:5px; border-left:3px solid ${q.isWrongInPdf ? '#d9383a' : 'var(--accent)'};">
          <strong>Explanation:</strong> ${q.explanation}
        </div>
      </div>`;
  }

  let attempted = 0;
  for (let i = startBound; i <= endBound; i++) { if (userAnswers[i] !== undefined) attempted++; }
  const wrong = attempted - correct;
  const score = (correct * 2) - (wrong * 0.5);
  
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('footerBar').style.display = 'none';
  const res = document.getElementById('results');
  res.style.display = 'block';
  res.innerHTML = `
    <div class="card">
      <h2 style="text-align:center; color:var(--accent)">Results Summary (Current Sheet)</h2>
      <div class="stats-grid">
        <div class="stat-box"><h4>Score</h4><p>${score.toFixed(2)}</p></div>
        <div class="stat-box"><h4>Correct</h4><p>${correct}</p></div>
        <div class="stat-box"><h4>Wrong</h4><p>${wrong}</p></div>
        <div class="stat-box"><h4>Time</h4><p>${document.getElementById('timer').innerText}</p></div>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
        <button class="btn" onclick="downloadResult()">Download Result</button>
        <button class="btn" style="background:#6c757d" onclick="window.location.reload();">Main Menu / Retry</button>
      </div>
    </div>
    ${reviewHTML}
  `;
}

function downloadResult() {
    const resultsContent = document.getElementById('results').innerHTML;
    const blob = new Blob([`<html><head><style>body{font-family:sans-serif; padding:20px;} .card{border:1px solid #ddd; padding:20px; border-radius:10px; margin-bottom:10px;} .stats-grid{display:flex; gap:20px;} .review-opt{padding:5px; margin:2px; border:1px solid #eee; border-radius:5px;} .wrong-marked{color:#d9383a !important;} .cat-header { background: #eef2f7; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #69707a; margin-bottom: 5px; display: inline-block; }</style></head><body>${resultsContent}</body></html>`], {type: 'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Narration_Exam_Scorecard.html'; a.click();
}
</script>
