<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Practice Test Template</title>
<style>
:root{
  --accent:#2ec4b6;
  --accent-dark:#1da89a;
  --muted:#69707a;
  --success:#1f9e5a;
  --danger:#c82d3f;
  --bg:#f5f7fa;
  --card:#fff;
  --maxw:820px;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#111;padding-bottom:120px}
.container{max-width:var(--maxw);margin:auto;padding:10px 16px}
header{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.08);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:12px}
h1{margin:0;color:var(--accent);font-size:18px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent-dark)}
.btn-ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);padding:8px 12px;border-radius:999px;font-weight:700;cursor:pointer}
.timer-text{color:var(--accent-dark);font-weight:700;font-size:18px;min-width:72px;text-align:right}
.toggle-pill{position:relative;width:90px;height:30px;background:#eaeef0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:13px;color:#444;font-weight:600}
.toggle-pill span{z-index:2;flex:1;text-align:center;pointer-events:none}
.toggle-pill::before{content:"";position:absolute;top:3px;left:3px;width:42px;height:24px;background:var(--accent);border-radius:999px;transition:.28s}
.toggle-pill.active::before{transform:translateX(45px);background:var(--accent-dark)}
.toggle-pill.active span:last-child{color:#fff}
.toggle-pill span:first-child{color:#fff}
.card{background:var(--card);border-radius:10px;padding:15px;margin:12px 0;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qmeta, .marking{font-size:13px;color:var(--muted)}
.qtext{font-size:16px;margin-bottom:15px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:10px}
.opt{padding:12px;border:1px solid #e6eaec;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent)}
.opt.selected{border:2px solid var(--accent)}
.opt.correct{border:2px solid var(--success);background:rgba(31,158,90,0.1)}
.opt.wrong{border:2px solid var(--danger);background:rgba(200,45,63,0.1)}
.fbar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -3px 12px rgba(0,0,0,0.08);display:flex;justify-content:center;z-index:50}
.fbar-inner{display:flex;justify-content:center;gap:15px;width:100%;padding:15px}

/* SCROLLABLE PALETTE */
#palette{position:fixed;top:70px;right:20px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.15);padding:15px;display:none;flex-direction:column;z-index:200;max-width:280px;max-height:70vh;}
.palette-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;overflow-y:auto;padding-right:5px;}
.qbtn{width:40px;height:40px;border-radius:6px;border:1px solid #ddd;cursor:pointer;font-weight:bold;flex-shrink:0;}
.qbtn.answered{background:var(--accent);color:white;border:none}
.qbtn.current{border:2px solid var(--accent);background:rgba(46,196,182,0.1)}
#palette-summary{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid #eee;padding-top:8px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:300}
.modal-content{background:#fff;padding:25px;border-radius:12px;text-align:center;width:90%;max-width:400px}
.explanation{margin-top:15px;padding:12px;background:#f0f7f7;border-radius:8px;display:none;font-size:14px;border-left:4px solid var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));gap:10px;margin-bottom:20px}
.stat-box{background:#f8fafb;padding:10px;border-radius:8px;border:1px solid #eef1f2;text-align:center}
.stat-box h4{margin:0;font-size:12px;color:var(--muted)}
.stat-box p{margin:5px 0 0;font-weight:bold;font-size:18px;color:var(--accent)}
.review-q{border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px;}
.review-opt{padding: 8px; margin: 4px 0; border-radius: 5px; font-size: 14px;}

.select-box { width: 100%; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; font-family: inherit; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="toggle-pill" id="modeToggle"><span>Test</span><span>Quiz</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="timer-text" id="timer">00:00</div>
      <button id="submitBtn" class="btn">Submit</button>
      <button id="paletteBtn" class="btn-ghost">View</button>
    </div>
  </div>
</header>

<div class="container">
  <div id="quizCard" class="card" style="display:none;">
    <div class="qbar">
      <div class="qmeta">Question <span id="qindex">1</span> / <span id="qtotal">0</span></div>
      <div class="marking" id="marking"></div>
    </div>
    <div id="passageArea" style="background:#f9f9f9; padding:15px; border-radius:8px; margin-bottom:15px; font-size:15px; display:none;"></div>
    <div class="qtext" id="qtext"></div>
    <div class="options" id="options"></div>
    <div id="explanation" class="explanation"></div>
  </div>

  <div id="results" class="results" style="display:none"></div>
</div>

<div class="fbar" id="footerBar" style="display:none;">
  <div class="fbar-inner">
    <button id="prevBtn" class="btn">← Prev</button>
    <button id="clearBtn" class="btn" style="background:#6c757d">Clear</button>
    <button id="nextBtn" class="btn">Next →</button>
  </div>
</div>

<div id="palette">
    <div class="palette-grid" id="paletteGrid"></div>
    <div id="palette-summary"></div>
</div>

<div id="classModal" class="modal" style="display:flex;">
  <div class="modal-content">
    <h3 style="color:var(--accent); margin-top:0;">Select Practice Class</h3>
    <p>Please select which PDF you want to attempt:</p>
    <select id="classSelect" class="select-box">
      <option value="1">Misc Grammar Practice - 1 (40 Qs)</option>
      <option value="2">Misc Grammar Practice - 2 (40 Qs)</option>
      <option value="3">Misc Grammar Practice - 3 (40 Qs)</option>
      <option value="4">Misc Grammar Practice - 4 (40 Qs)</option>
      <option value="5">Misc Grammar Practice - 5 (40 Qs)</option>
      <option value="6">Misc Grammar Practice - 6 (40 Qs)</option>
      <option value="7">Misc Grammar Practice - 7 (35 Qs)</option>
    </select>
    <button id="startQuizBtn" class="btn" style="width:100%; padding:12px; font-size:15px; margin-top:10px;">Start Quiz</button>
  </div>
</div>

<div id="submitModal" class="modal">
  <div class="modal-content">
    <h3>Submit Quiz?</h3>
    <p id="submitMsg"></p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:20px">
      <button id="cancelSubmit" class="btn-ghost">Cancel</button>
      <button id="confirmSubmit" class="btn">Confirm</button>
    </div>
  </div>
</div>

<script>
// RAW DATA STRINGS FROM ALL 7 FILES PRECISELY PRE-LOADED
const DATA_STORE = {
  1: [
    { question: "The villagers explained that (a)/ the repairing of the old well must be (b)/ either supervised by the panchayat members (c)/ or a certified engineer from the district office. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Parallel structure mismatch with 'either... or'. Move 'either' after 'supervised'." },
    { question: "The residents pointed out that (a)/ the new parking rules would be (b)/ challenging to follow because they (c)/ had become used to park their vehicles wherever they found a spot. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 3, explanation: "Phrase 'used to' here requires a gerund: change 'park' to 'parking'." },
    { question: "The shopkeepers are facing heavy losses (a)/ since the new flyover diverted most of the traffic (b)/ away from their marketplace. (c) No error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Action continuing from a point of time in the past requires present perfect continuous: 'have been facing'." },
    { question: "I am sure that (a)/ the courier service used to be (b)/ delivering the documents today (c)/ as the tracking status showed 'out for delivery' in the morning. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Expected dynamic action happening today: change 'used to be' to 'will be'." },
    { question: "The ongoing challenges faced by rural healthcare centres, (a)/ which include a shortage of trained staff, outdated equipment, and (b)/ irregular supply of essential medicines, is affecting the quality of treatment provided to villagers. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Main subject 'challenges' is plural, verb must be 'are affecting'." },
    { question: "While crossing the busy intersection, (a)/ the sudden honking of a truck startled Rohan (b)/ and he stepped back in fear. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Dangling modifier error. Use 'While Rohan was crossing' or 'While he was crossing'." },
    { question: "\"Can you join us for the neighbourhood cleanliness drive?\" (a)/ \"I really want to, but our department's weekly briefing usually (b)/ will begin at 9 a.m. (c)/ and continues for more than two hours.\" (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Routine habits use simple present tense: change 'will begin' to 'begins'." },
    { question: "If the committee had resolved the maintenance issues earlier, (a)/ the residents of the housing society (b)/ would not face recurring problems in the monsoon season. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Type 3 conditional format mismatch: change 'would not face' to 'would not have faced'." },
    { question: "Travellers must remember that it can (a)/ get extreme hot in the desert regions (b)/ of Rajasthan by early afternoon, so they (c)/ should carry enough water and sun protection. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Use an adverb to modify the adjective: change 'extreme' to 'extremely'." },
    { question: "With passage in time, (a)/ the villagers understood the importance of conserving groundwater (b)/ and adopted rainwater-harvesting practices wholeheartedly. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Incorrect idiom. Use standard phrase 'with the passage of time'." },
    { question: "The classroom allotted for the training session (a)/ was not enough large to accommodate all the participants (b)/ who had travelled from different districts for the programme. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "'enough' succeeds adjectives: replace with 'large enough'." },
    { question: "The authorities will not let (a)/ we and they enter the restricted zone (b)/ until the debris is completely cleared. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "'let' takes object pronouns: replace with 'us and them'." },
    { question: "The inspector wanted to know (a)/ why was the shop closed (b)/ while rest of the market was functioning normally that day. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Embedded reported questions use non-inverted structure: 'why the shop was closed'." },
    { question: "The vigilance officer stated that (a)/ he had scarcely obtained something (b)/ from the preliminary reports (c)/ that could confirm the bribery allegations. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "'scarcely' carries a negative context, so it requires 'anything' instead of 'something'." },
    { question: "Could you please avoid speaking so faster (a)/ when you explain the new procedures, (b)/ as several trainees are unable to follow you clearly? (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Use positive degree after modifier 'so': change 'faster' to 'fast'." },
    { question: "Walking through the crowded marketplace, (a)/ the aroma of freshly prepared jalebis (b)/ reminded Priya of her childhood visits to her grandparents' home. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Dangling modifier error. Change to 'While Priya was walking through...'" },
    { question: "Select the grammatically correct sentence.", options: ["It is a old uniform but a memorable thing for me.", "It is old uniform but a memorable thing for me.", "It is the old uniform but memorable thing for me.", "As a society, we must recognise that equal access to education strengthens the foundation of any developing nation."], answer: 3, explanation: "Generic use of 'society' takes indefinite article 'a' cleanly." },
    { question: "Select the grammatically correct sentence.", options: ["A MLA raised the issue of illegal mining.", "An MLA raised issue of an illegal mining.", "An MLA raised the issue of illegal mining during the assembly session held this morning.", "MLA raised the issue during the session."], answer: 2, explanation: "'MLA' starts with a vowel sound (em-el-a) requiring article 'an'." },
    { question: "The cab driver informed the passengers (a)/ that he may take a slightly longer route (b)/ because the main road was blocked due to ongoing repairs. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Past tense main clause ('informed') requires past modal equivalent: replace 'may' with 'might'." },
    { question: "Mrs. Sharma, the most dedicated volunteer associated with our community centre (a)/ have decided to organize a long awareness drive (b)/ to address health and hygiene issues in the surrounding localities. (c)/no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Singular subject 'Mrs. Sharma' takes singular verb form 'has decided'." },
    { question: "The doctor assured the worried family members (a)/ that he would careful examine (b)/ every detail of the patient's medical history before recommending further treatment. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Use adverb to modify verb: change 'careful examine' to 'carefully examine'." },
    { question: "After attending the cultural festival organized in our city last weekend, (a)/ my neighbour described about the vibrant performances (b)/ presented by various artists from different states. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "'describe' is a transitive verb; remove redundant preposition 'about'." },
    { question: "She became extremely embarrassed (a)/while her colleague suddenly interrupted (b)/the meeting by raising a personal issue (c)/that had nothing to do with the discussion. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Use point-of-time conjunction 'when' instead of ongoing framework 'while'." },
    { question: "The report was drafted by the investigative journalists (a)/ exposed a series of unethical practices (b)/ compelling authorities (c)/ to take immediate corrective measures. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Reduced relative clause needed: remove auxiliary 'was' to leave just 'drafted'." },
    { question: "The young athlete competed (a)/ as strong as the national-level participants (b)/ throughout the exhausting championship. (c)/ No error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Adverbial modifier form required: change to 'as strongly as'." },
    { question: "Sentence Improvement: This library is a quiet place to study as it allows students to focus...", options: ["is a quiet place to be studying", "is the quietest place to studies", "No correction required", "is a noisy place to study"], answer: 2, explanation: "The original layout is completely flawless." },
    { question: "Sentence Improvement: The report stated that no less than fifty complaints had been registered...", options: ["None fewer than", "No fewer than", "Not lesser than", "No little than"], answer: 1, explanation: "Countable items like 'complaints' require plural determiner form 'No fewer than'." },
    { question: "Sentence Improvement: In what ways do you believe social media platforms have transformed...", options: ["have altered the way citizens voice", "have destroyed how citizens speak", "have modified the pattern citizens tell", "have manipulated the citizens to express"], answer: 0, explanation: "Preserves precise conversational style register values perfectly." },
    { question: "Sentence Improvement: The results just came out, and the candidates received their scorecards now.", options: ["The results have just come out, and the candidates have received their scorecards now.", "The results have been coming out...", "The results just come out...", "The results are just coming out..."], answer: 0, explanation: "Time cues 'just' and 'now' call exclusively for present perfect structures." },
    { question: "Sentence Improvement: This year's budget is ambitious than the one introduced...", options: ["the most ambitious", "less ambitious", "more ambitious than", "the most ambitious than"], answer: 2, explanation: "Comparative tracking construction with 'than' matches 'more ambitious than'." },
    { question: "Sentence Improvement: The newly constructed metro station is appearing like a modern airport...", options: ["appears like", "has appeared like", "is appeared like", "No substitution required"], answer: 0, explanation: "Stative usage rule requires simple present form 'appears like'." },
    { question: "Sentence Improvement: ...and we will take him to the emergency ward as the pain becomes stronger.", options: ["we should take him to the emergency ward immediately before the pain becomes stronger", "we took him to the emergency ward now...", "No substitution", "we will be taking him..."], answer: 0, explanation: "Presents the most sound conditional precautionary solution framework." },
    { question: "Sentence Improvement: Ravi phoned the catering service and ordered for fifty meal boxes...", options: ["ordered fifty meal boxes", "ordered to fifty meal boxes", "ordered for to fifty meal boxes", "No substitution"], answer: 0, explanation: "'order' functions as a transitive verb here; no preposition needed." },
    { question: "Sentence Improvement: The weather was stormy, the fishermen decided not to sail into the deep sea.", options: ["The weather being stormy, the fishermen decided not to sail into the deep sea.", "The weather having stormy...", "The weather was stormy and...", "No substitution required"], answer: 0, explanation: "Absolute participial modifier layout presents high syntactic accuracy." },
    { question: "Sentence Improvement: ...government schools have upgraded their infrastructure and come all along...", options: ["come a long way", "come along the way", "are coming along", "No substitution required"], answer: 0, explanation: "Standard idiomatic phrase for tremendous progress is 'come a long way'." },
    { question: "Sentence Improvement: Residents in the protected wildlife zone are prohibited to feed animals...", options: ["are prohibited from feeding", "are prohibited for feeding", "are prohibit to feed", "No improvement"], answer: 0, explanation: "'prohibited' correlates explicitly with 'from + gerund'." },
    { question: "Sentence Improvement: ...they were besides themselves with frustration...", options: ["they were beside themselves", "they went beside themselves", "they were beside himself", "No improvement"], answer: 0, explanation: "Idiom for extreme emotional state is 'beside themselves' without final 's'." },
    { question: "Sentence Improvement: ...Radhika got married with an army officer...", options: ["got married to", "got married for", "has marriage with", "No improvement"], answer: 0, explanation: "Marital combination verb state takes preposition 'married to'." },
    { question: "Sentence Improvement: ...residents of Delhi have been warned for avoiding outdoor activities...", options: ["have been warned to avoid", "has been warned to avoid", "have been warning to avoid", "No substitution required"], answer: 0, explanation: "Passive infinitive target direction pattern: 'have been warned to avoid'." },
    { question: "By the time the guests arrive at the venue this evening, the catering staff ............ all the dishes and arranged them on the buffet counters.", options: ["will be prepared", "will have prepared", "will prepared", "will have preparing"], answer: 1, explanation: "'by the time' paired with a future simple clause requires future perfect completion 'will have prepared'." }
  ],
  2: [
    { question: "Ritika said that she had discovered (a)/ a twenty kilometres long (b)/ tunnel while travelling through the remote areas (c)/ near the Maharashtra-Karnataka border. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Use singular form inside hyphenated compound modifier: 'a twenty kilometre long'." },
    { question: "The old teacher looked at Rohan (a)/ with a fond of expression, (b)/ when he returned to the school after recovering from his illness. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Remove 'of' to keep basic descriptive layout phrase: 'a fond expression'." },
    { question: "The schoolboy left the lab secretly (a)/ after breaking the delicate equipment, (b)/ creating a tense situation for the staff who blamed for it. (c)/ No error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Passive structure required: change 'who blamed' to 'who were blamed' or 'was blamed'." },
    { question: "He is confident of his recovery (a)/ and is taking all the precautions (b)/ suggested by the doctor. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 3, explanation: "The sentence contains no structural or prepositional errors." },
    { question: "Rohan returned the expensive watch (a)/ that he found in the mall to its owner (b)/ though he could sell (c)/ it to someone for a good price.(d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Past unfulfilled capability requires past modal perfect: 'could have sold'." },
    { question: "The mechanic told Mr. Sharma that (a)/ he would repair the car by two days, (b)/ as the essential parts had already arrived from the company. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Timeframe limits utilize preposition 'within two days' instead of 'by'." },
    { question: "The relatives insisted that a family dinner (a)/ is organized at couple's ancestral home after the marriage (b)/ so that everyone could bless the couple. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "The verb 'insisted' requires subjunctive mood trigger 'be' or 'should be organized'." },
    { question: "Which is faster train, (a)/ the Vande Bharat Express or the Tejas Express, (b)/ when both are known for covering long distances (c)/ with remarkable speed and offering premium facilities to passengers? (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Choice between two clear entities calls for definite comparative: 'the faster train'." },
    { question: "The earlier you start preparing for your long-term goals, (a)/ faster you achieve them and (b)/ secure your future. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Parallel double comparative format demands matching layout: 'the faster you achieve'." },
    { question: "Bread and butter is being (a)/ sold at discounted rates today, (b)/ at the store located near the railway station (c)/ so we should also go there. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "When separate distinct items are sold at individual price metrics, use plural verb 'are'." },
    { question: "Hard work and consistency (a)/ plays a major role in shaping a student's future, (b)/ especially when the competition around them keeps increasing every year. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Plural abstract nouns joined by 'and' require base plural verb form: change 'plays' to 'play'." },
    { question: "My grandfather has often advised me (a)/ to stay patient in difficult situations, (b)/ as he believes calmness solves more problems than anger. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Habitual frequency expressions belong in simple present: 'often advises'." },
    { question: "This wooden box (a)/ is containing the rare coins that my grandfather (b)/ has collected over several decades. (c)/ No error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Stative verb 'contain' cannot be formatted continuously; substitute with 'contains'." },
    { question: "This new team member is always coming (a)/ late to the meetings, (b)/which irritates all other members. (c)/ No error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 3, explanation: "Continuous combined with 'always' correctly highlights an irritating persistent habit. No error." },
    { question: "Riya asked her mother (a)/ that she could join the new weekend art classes (b)/ that had recently opened near their apartment. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Indirect interrogatives take conditional clause conjunction 'if' or 'whether' instead of 'that'." },
    { question: "No student and teacher (a)/ are allowed to enter the laboratory without proper safety equipment, (b)/ which has been made mandatory after the recent incident. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Singularity structure qualified via 'no' takes singular verb form: change 'are' to 'is'." },
    { question: "As the new teacher explains all the (a)/ concepts using easy day to day examples (b)/ so all the students understand the concepts easily (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Subordinate starter 'As' renders subsequent correlative 'so' completely redundant; remove it." },
    { question: "Complaints after complaints (a)/ was filed by the residents to draw the authorities' attention (b)/ to the increasing noise pollution in their neighbourhood. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Noun + Preposition + Noun repetition takes absolute singular nouns: 'Complaint after complaint'." },
    { question: "Rhea was disappointed (a)/ at us arriving late to the conference, (b)/ as it created a negative impression (c)/ before the international delegates. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Gerund actions require proper possessive pronoun form: 'our arriving'." },

let QUESTIONS = [];
let currentIdx = 0;
let userAnswers = {};
let timerSeconds = 0;
let quizMode = false;
let timerObj;

document.getElementById('startQuizBtn').onclick = function() {
  const selectedValue = document.getElementById('classSelect').value;
  QUESTIONS = DATA_STORE[selectedValue];
  
  document.getElementById('classModal').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('footerBar').style.display = 'flex';
  
  init();
};

function init() {
  currentIdx = 0;
  userAnswers = {};
  timerSeconds = 0;
  document.getElementById('qtotal').innerText = QUESTIONS.length;
  renderQuestion();
  clearInterval(timerObj);
  startClock();
  setupPalette();
}

function renderQuestion() {
  const q = QUESTIONS[currentIdx];
  document.getElementById('qindex').innerText = currentIdx + 1;
  document.getElementById('qtext').innerHTML = `<strong>${q.question}</strong>`;
  document.getElementById('marking').innerHTML = `Marking: <span style="color:var(--success)">+2.00</span> / <span style="color:var(--danger)">-0.50</span>`;
  
  const optContainer = document.getElementById('options');
  const expContainer = document.getElementById('explanation');
  optContainer.innerHTML = "";
  expContainer.style.display = "none";

  q.options.forEach((txt, i) => {
    const div = document.createElement('div');
    div.className = 'opt' + (userAnswers[currentIdx] === i ? ' selected' : '');
    div.innerHTML = `<span>${String.fromCharCode(65 + i)}.</span> ${txt}`;
    div.onclick = () => { userAnswers[currentIdx] = i; renderQuestion(); updatePalette(); };
    optContainer.appendChild(div);
  });
  if (quizMode && userAnswers[currentIdx] !== undefined) showFeedback();
}

function showFeedback() {
  const q = QUESTIONS[currentIdx];
  const opts = document.getElementById('options').children;
  const exp = document.getElementById('explanation');
  Array.from(opts).forEach((el, i) => {
    el.classList.remove('correct', 'wrong');
    if (i === q.answer) el.classList.add('correct');
    else if (i === userAnswers[currentIdx]) el.classList.add('wrong');
  });
  exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
  exp.style.display = "block";
}

function startClock() {
  timerObj = setInterval(() => {
    timerSeconds++;
    const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const s = (timerSeconds % 60).toString().padStart(2, '0');
    document.getElementById('timer').innerText = `${m}:${s}`;
  }, 1000);
}

function setupPalette() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = "";
  QUESTIONS.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'qbtn';
    b.innerText = i + 1;
    b.onclick = () => { currentIdx = i; renderQuestion(); document.getElementById('palette').style.display = 'none'; };
    grid.appendChild(b);
  });
  updatePalette();
}

function updatePalette() {
  const btns = document.getElementById('paletteGrid').children;
  let attempted = 0;
  Array.from(btns).forEach((b, i) => {
    b.classList.remove('current', 'answered');
    if (i === currentIdx) b.classList.add('current');
    if (userAnswers[i] !== undefined) { b.classList.add('answered'); attempted++; }
  });
  document.getElementById('palette-summary').innerText = `Total: ${QUESTIONS.length} | Attempted: ${attempted}`;
}

document.getElementById('nextBtn').onclick = () => { if (currentIdx < QUESTIONS.length - 1) { currentIdx++; renderQuestion(); } };
document.getElementById('prevBtn').onclick = () => { if (currentIdx > 0) { currentIdx--; renderQuestion(); } };
document.getElementById('clearBtn').onclick = () => { delete userAnswers[currentIdx]; renderQuestion(); updatePalette(); };
document.getElementById('paletteBtn').onclick = () => { 
  const p = document.getElementById('palette');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  updatePalette();
};
document.getElementById('modeToggle').onclick = function() { this.classList.toggle('active'); quizMode = !quizMode; renderQuestion(); };
document.getElementById('submitBtn').onclick = () => { 
  document.getElementById('submitMsg').innerText = `Attempted ${Object.keys(userAnswers).length}/${QUESTIONS.length}`;
  document.getElementById('submitModal').style.display = 'flex'; 
};
document.getElementById('cancelSubmit').onclick = () => { document.getElementById('submitModal').style.display = 'none'; };
document.getElementById('confirmSubmit').onclick = () => { clearInterval(timerObj); document.getElementById('submitModal').style.display = 'none'; showResults(); };

function showResults() {
  let correct = 0;
  let reviewHTML = `<div class="card"><h2 style="text-align:center; color:var(--accent)">Review & Answer Key</h2>`;

  QUESTIONS.forEach((q, i) => {
    const isCorrect = userAnswers[i] === q.answer;
    if (isCorrect) correct++;
    const statusText = userAnswers[i] === undefined ? '<span style="color:var(--muted)">Unattempted</span>' : (isCorrect ? '<span style="color:var(--success); font-weight:bold">Correct</span>' : '<span style="color:var(--danger); font-weight:bold">Wrong</span>');

    reviewHTML += `
      <div class="review-q">
        <p><strong>Q${i+1}. ${q.question}</strong> (${statusText})</p>
        <div>
          ${q.options.map((opt, optIdx) => {
            let bgColor = "transparent"; let borderColor = "#eee";
            if (optIdx === q.answer) { bgColor = "#e8f5e9"; borderColor = "#4caf50"; }
            else if (optIdx === userAnswers[i]) { bgColor = "#ffebee"; borderColor = "#f44336"; }
            return `<div class="review-opt" style="border:1px solid ${borderColor}; background:${bgColor}; padding:8px; margin:4px 0; border-radius:5px;">${String.fromCharCode(65 + optIdx)}. ${opt} ${optIdx === q.answer ? '✅' : (optIdx === userAnswers[i] ? '❌' : '')}</div>`;
          }).join('')}
        </div>
        <div style="margin-top:10px; font-size:14px; background:#f9f9f9; padding:8px; border-radius:5px; border-left:3px solid var(--accent);">
          <strong>Explanation:</strong> ${q.explanation}
        </div>
      </div>`;
  });

  const wrong = Object.keys(userAnswers).length - correct;
  const score = (correct * 2) - (wrong * 0.5);
  
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('footerBar').style.display = 'none';
  const res = document.getElementById('results');
  res.style.display = 'block';
  res.innerHTML = `
    <div class="card">
      <h2 style="text-align:center; color:var(--accent)">Results Summary</h2>
      <div class="stats-grid">
        <div class="stat-box"><h4>Score</h4><p>${score.toFixed(2)}</p></div>
        <div class="stat-box"><h4>Correct</h4><p>${correct}</p></div>
        <div class="stat-box"><h4>Wrong</h4><p>${wrong}</p></div>
        <div class="stat-box"><h4>Time</h4><p>${document.getElementById('timer').innerText}</p></div>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
        <button class="btn" onclick="downloadResult()">Download Result</button>
        <button class="btn" style="background:#6c757d" onclick="location.reload()">Re-Attempt / Change Set</button>
      </div>
    </div>
    ${reviewHTML}
  `;
}

function downloadResult() {
    const resultsContent = document.getElementById('results').innerHTML;
    const blob = new Blob([`<html><head><style>body{font-family:sans-serif; padding:20px;} .card{border:1px solid #ddd; padding:20px; border-radius:10px; margin-bottom:10px;} .stats-grid{display:flex; gap:20px;} .review-opt{padding:5px; margin:2px; border:1px solid #eee; border-radius:5px;}</style></head><body>${resultsContent}</body></html>`], {type: 'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Grammar_Exam_Scorecard.html'; a.click();
}
</script>
