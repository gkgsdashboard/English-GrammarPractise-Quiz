<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Practice Test Template</title>
<style>
:root{
  --accent:#2ec4b6;
  --accent-dark:#1da89a;
  --muted:#69707a;
  --success:#1f9e5a;
  --danger:#c82d3f;
  --bg:#f5f7fa;
  --card:#fff;
  --maxw:820px;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#111;padding-bottom:120px}
.container{max-width:var(--maxw);margin:auto;padding:10px 16px}
header{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.08);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:12px}
h1{margin:0;color:var(--accent);font-size:18px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent-dark)}
.btn-ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);padding:8px 12px;border-radius:999px;font-weight:700;cursor:pointer}
.timer-text{color:var(--accent-dark);font-weight:700;font-size:18px;min-width:72px;text-align:right}
.toggle-pill{position:relative;width:90px;height:30px;background:#eaeef0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:13px;color:#444;font-weight:600}
.toggle-pill span{z-index:2;flex:1;text-align:center;pointer-events:none}
.toggle-pill::before{content:"";position:absolute;top:3px;left:3px;width:42px;height:24px;background:var(--accent);border-radius:999px;transition:.28s}
.toggle-pill.active::before{transform:translateX(45px);background:var(--accent-dark)}
.toggle-pill.active span:last-child{color:#fff}
.toggle-pill span:first-child{color:#fff}
.card{background:var(--card);border-radius:10px;padding:15px;margin:12px 0;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qmeta, .marking{font-size:13px;color:var(--muted)}
.qtext{font-size:16px;margin-bottom:15px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:10px}
.opt{padding:12px;border:1px solid #e6eaec;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent)}
.opt.selected{border:2px solid var(--accent)}
.opt.correct{border:2px solid var(--success);background:rgba(31,158,90,0.1)}
.opt.wrong{border:2px solid var(--danger);background:rgba(200,45,63,0.1)}
.fbar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -3px 12px rgba(0,0,0,0.08);display:flex;justify-content:center;z-index:50}
.fbar-inner{display:flex;justify-content:center;gap:15px;width:100%;padding:15px}

#palette{position:fixed;top:70px;right:20px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.15);padding:15px;display:none;flex-direction:column;z-index:200;max-width:280px;max-height:70vh;}
.palette-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;overflow-y:auto;padding-right:5px;}
.qbtn{width:40px;height:40px;border-radius:6px;border:1px solid #ddd;cursor:pointer;font-weight:bold;flex-shrink:0;}
.qbtn.answered{background:var(--accent);color:white;border:none}
.qbtn.current{border:2px solid var(--accent);background:rgba(46,196,182,0.1)}
#palette-summary{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid #eee;padding-top:8px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:300}
.modal-content{background:#fff;padding:25px;border-radius:12px;text-align:center;width:90%;max-width:400px}
.explanation{margin-top:15px;padding:12px;background:#f0f7f7;border-radius:8px;display:none;font-size:14px;border-left:4px solid var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));gap:10px;margin-bottom:20px}
.stat-box{background:#f8fafb;padding:10px;border-radius:8px;border:1px solid #eef1f2;text-align:center}
.stat-box h4{margin:0;font-size:12px;color:var(--muted)}
.stat-box p{margin:5px 0 0;font-weight:bold;font-size:18px;color:var(--accent)}
.review-q{border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px;}
.review-opt{padding: 8px; margin: 4px 0; border-radius: 5px; font-size: 14px;}

/* Custom Dropdown/Popup Styling */
.select-box { width: 100%; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; font-family: inherit; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="toggle-pill" id="modeToggle"><span>Test</span><span>Quiz</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="timer-text" id="timer">00:00</div>
      <button id="submitBtn" class="btn">Submit</button>
      <button id="paletteBtn" class="btn-ghost">View</button>
    </div>
  </div>
</header>

<div class="container">
  <!-- Initially empty, wait for class selection -->
  <div id="quizCard" class="card" style="display:none;">
    <div class="qbar">
      <div class="qmeta">Question <span id="qindex">1</span> / <span id="qtotal">0</span></div>
      <div class="marking" id="marking"></div>
    </div>
    <div class="qtext" id="qtext"></div>
    <div class="options" id="options"></div>
    <div id="explanation" class="explanation"></div>
  </div>

  <div id="results" class="results" style="display:none"></div>
</div>

<div class="fbar" id="footerBar" style="display:none;">
  <div class="fbar-inner">
    <button id="prevBtn" class="btn">← Prev</button>
    <button id="clearBtn" class="btn" style="background:#6c757d">Clear</button>
    <button id="nextBtn" class="btn">Next →</button>
  </div>
</div>

<div id="palette">
    <div class="palette-grid" id="paletteGrid"></div>
    <div id="palette-summary"></div>
</div>

<!-- Class Selection Popup Modal -->
<div id="classModal" class="modal" style="display:flex;">
  <div class="modal-content">
    <h3 style="color:var(--accent); margin-top:0;">Select Practice Class</h3>
    <p>Please select which PDF/Practice Class you want to give the quiz for:</p>
    <select id="classSelect" class="select-box">
      <option value="class1">Practice Class - 01 (25 Questions)</option>
      <option value="class2">Practice Class - 02 (40 Questions)</option>
      <option value="class3">Practice Class - 03 (40 Questions)</option>
      <option value="class4">Practice Class - 04 (40 Questions)</option>
      <option value="class5">Practice Class - 05 (40 Questions)</option>
      <option value="class6">Practice Class - 06 (40 Questions)</option>
      <option value="class7">Practice Class - 07 (40 Questions)</option>
      <option value="class8">Practice Class - 08 (40 Questions)</option>
      <option value="class9">Practice Class - 09 (40 Questions)</option>
      <option value="class10">Practice Class - 10 (40 Questions)</option>
    </select>
    <button id="startQuizBtn" class="btn" style="width:100%; padding:12px; font-size:15px; margin-top:10px;">Start Quiz</button>
  </div>
</div>

<div id="submitModal" class="modal">
  <div class="modal-content">
    <h3>Submit Quiz?</h3>
    <p id="submitMsg"></p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:20px">
      <button id="cancelSubmit" class="btn-ghost">Cancel</button>
      <button id="confirmSubmit" class="btn">Confirm</button>
    </div>
  </div>
</div>

<script>
// ALL QUESTIONS DATABASE EXTRACTED FROM INPUT DATA
const ALL_CLASSES = {
  class1: [
    { question: "The young lawyer said (a)/ that she can handle (b)/ all those clients alone (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Error in part (b). 'can' should be replaced with 'could' because the main clause is in the past tense ('said')." },
    { question: "I have decided that (a)/if Roshni will also be coming(b)/I will not go to the party (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Error in part (b). In conditional clauses, simple present tense is used instead of future tense when the main clause is in the future. 'will also be coming' should be fixed." },
    { question: "Mr Gupta, the most (a)/ experienced of all our employees (b)/ are going to handle your case.(c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Error in part (c). The subject 'Mr Gupta' is singular, so the verb should be 'is going' instead of 'are going'." },
    { question: "If things were not going to be normal (a)/ after the pandemic, mankind will (b)/ have to accept the new normal. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Error in part (a). To match the future condition 'will have to' in the main clause, the conditional clause should align logically." },
    { question: "The damaged will have (a)/ to be to be (b)/ either paid by you or your partner. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Error in part (c). Correlation error: 'either paid by you or by your partner' or 'paid by either you or your partner'." },
    { question: "This will be the most difficult of (a)/ the adjustments we have to make (b)/ because we have been used to (c)/ spend a lot on guests. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 3, explanation: "Error in part (d). 'used to' here requires a gerund: 'spending' instead of 'spend'." },
    { question: "She is waiting there (a)/for you since 7 am (b)/so I think you should(c)/ go and meet her.(d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Error in part (a). Since the action started in the past and continues up to now (indicated by 'since'), present perfect continuous 'She has been waiting' must be used." },
    { question: "I am sure that (a)/ the postman would be (b)/ coming shortly (c)/ to deliver the letter. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Error in part (b). 'will be coming shortly' indicates an expected future action, 'would' is incorrect here." },
    { question: "Our company is not (a)/making new school (b)/ bags since the lockdown started. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Error in part (a). Due to 'since the lockdown started', it must be present perfect continuous: 'has not been making'." },
    { question: "Maruti likes (a)/ adventure (b)/ stories, especially (c)/ an adventures of Tarzan. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 3, explanation: "Error in part (d). 'adventures' is plural and specific; it should be 'the adventures' instead of 'an adventures'." },
    { question: "It is not one of those (a)/ boxes which has (b)/the letters sent by finance ministry. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Error in part (b). The relative pronoun 'which' refers to the plural antecedent 'boxes', so the verb must be plural: 'have' instead of 'has'." },
    { question: "The receptionist asked Diya if she (a)/ will take a seat and (b)/ wait for the boss to call her in. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Error in part (b). Indirect speech in past tense ('asked') changes 'will' to 'would'." },
    { question: "Many a worker of the company (a)/ have complained of the poor sanitation (b)/ but the officials have paid no attention to it. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Error in part (b). 'Many a' is followed by a singular noun and a singular verb. It should be 'has complained' instead of 'have complained'." },
    { question: "Anti-party activities (a)/ improved my relations (b)/ with an opposition. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Error in part (c). It should be 'the opposition' (a specific political group) rather than 'an opposition'." },
    { question: "Hardik's horoscope says (a)/ that the stars (b)/ will be exercised (c)/ a benign influence on his life. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Error in part (c). Active voice is needed: 'will exercise' instead of passive 'will be exercised'." },
    { question: "All the horses, except one, always (a)/ behaved in a rough manner when (b)/ Robert come to clean the stable. (c)/no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Error in part (c). The sentence is in the past tense ('behaved'), so it should be 'Robert came' instead of 'come'." },
    { question: "Do you know (a)/that this is third time that you (b)/have made the same mistake ? (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Error in part (b). Ordinal numbers require the definite article: 'this is the third time'." },
    { question: "You wash (a)/ the dishes and (b)/ I dry the same. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Error in part (c). Using 'the same' as a pronoun is incorrect; it should be 'them' ('I dry them')." },
    { question: "I know it very well (a)/ that you are owning a big luxurious (b)/ house but you need not brag (c)/ about it all day. (d)", options: ["(a)/", "(b)", "(c)", "(d)"], answer: 1, explanation: "Error in part (b). Stative verbs like 'own' are generally not used in the continuous form. Replace 'are owning' with 'own'." },
    { question: "Hardly we had boarded (a)/ the train when (b)/it started moving. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Error in part (a). When a sentence begins with a negative adverbial like 'Hardly', inversion is required: 'Hardly had we boarded'." },
    { question: "The young boy told us (a)/ that he has won a gold medal (b)/at a national level swimming competition. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Error in part (b). Main clause is past ('told'), so indirect narration should use past perfect: 'had won' instead of 'has won'." },
    { question: "She was waiting (a)/ for an opportunity (b)/starting her own business. (c)/ no error", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Error in part (c). Infinitive structure needed: 'to start her own business' instead of 'starting'." },
    { question: "After a lot of meetings and negotiations, (a)/a deal has been signed (b)/between India, Pakistan and China.(c) no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 3, explanation: "No error (d). 'Between' can be used for more than two entities when referring to reciprocal relationships or distinct items/countries." },
    { question: "Parents should tell (a)/their children to exercise (b)/great care while crossing busy roads (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 3, explanation: "No error (d). The sentence is grammatically sound." },
    { question: "Select the grammatically correct sentence.", options: ["It is a old uniform but a memorable thing for me.", "It is old uniform but a memorable thing for me.", "It is the old uniform but memorable thing for me.", "It is an old uniform but a memorable thing for me."], answer: 3, explanation: "Option (d) is correct because 'old' starts with a vowel sound requiring 'an', and 'memorable thing' correctly uses 'a'." }
  ],
  class2: [
    { question: "The availability of funds will be (a)/ ensured if they all tried to (b)/ submit the proposals on time. (c)/ No error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Conditional mismatch: 'will be ensured' matches with present tense 'try'." },
    { question: "Neetu is (a)/ waiting for you(b)/ since 10 o'clock (c)/ in the morning. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Use present perfect continuous: 'has been waiting' due to 'since 10 o'clock'." },
    { question: "Karan call the restaurant (a)/ to ask if he could (b)/ reserve a table for tomorrow. (c) / No error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Past tense is needed to match 'could': 'Karan called'." },
    { question: "After knowing truth, (a)/ the jury took the (b)/right decision in the case. (c) no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Requires definite article: 'knowing the truth'." },
    { question: "He promised them (a)/ that he would sure repay (b)/ the loan urgently. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Adverb should modify the verb: 'would surely repay'." },
    { question: "Darshan wished (a)/he hasn't gone (b)/to the theme park (c) / in the first place. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Past wish requires past perfect: 'hadn't gone'." },
    { question: "I can't talk right now. (a)/ I am being really busy. (b)/ I'll call you later. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Simple state: 'I am really busy'." },
    { question: "We all know that (a)/ the lion is the more (b)/ferocious of all animals (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Comparing with all items requires superlative degree: 'the most ferocious'." },
    { question: "The present-century threats to our environment, (a)/ which include interfering species, ailments, pollution and (b)/ a boiling temperature, is putting wildlife populations at peril. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Subject 'threats' is plural, so verb should be 'are putting'." },
    { question: "I think Jeremy will not (a)/ have saved enough money (b)/ by the time the year ends.(c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 3, explanation: "No error." },
    { question: '\"Do you want to join us for lunch?\" (a)/ \"I\'m sorry (b)/ my physics class will start at 1 p.m. (c)/ and doesn\'t finish till 3 p.m.\" (d)', options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Scheduled timetables use simple present: 'starts at 1 p.m.'." },
    { question: "If you had talked (a)/ to her earlier, she (b)/ would not interfere in this matter (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Third conditional requirement: 'would not have interfered'." },
    { question: "Sky appears blue (a)/ as it absorbs (b)/ all colours and (c)/ reflects only blue. (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Unique natural objects require 'The': 'The sky'." },
    { question: "Last night I was fallen(a)/ asleep while I was (b)/ reading a book. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Idiomatic expression: 'I fell asleep'." },
    { question: "She rarely approached nobody (a)/ to talk about the problems (b)/ that she was facing. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 0, explanation: "Double negative: 'rarely approached anybody'." },
    { question: "It was (a) / by a chance (b) / he saw a movie in a theatre (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 1, explanation: "Idiomatic phrase is 'by chance', no article 'a' needed." },
    { question: "Her hopes of buying (a)/her own house got (b)/crush when she lost (c)/her jewellery box.(d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 2, explanation: "Passive sense: 'got crushed'." },
    { question: "You can fool some of the people all the time, (a)/and all the people some of the time; (b)/but you cannot fool all the people all the time. (c)/ no error (d)", options: ["(a)", "(b)", "(c)", "(d)"], answer: 3, explanation: "No error." },
    { question: "Select the grammatically correct sentence.", options: ["The participants of the competition have been waited for their turn curiously.", "The participants of the competition wait for their turn curiously.", "The participants of the competition are waiting for their turn curiously.", "The participants of the competition are waiting for his turn curiously."], answer: 2, explanation: "Option (c) properly represents active ongoing action with plural pronoun agreement ('their turn')." },
    { question: "Select the grammatically correct statement from among the given options.", options: ["It is a nice party. I am enjoying the party.", "It is a party. I am enjoying an party.", "It is party. I am enjoying a party.", "It is the party. I am enjoying an party."], answer: 0, explanation: "Option (a) correctly establishes the party with indefinite article first, then uses definite article 'the party' upon repetition." },
    { question: "Which of the following is grammatically correct.", options: ["We should be all help each other.", "We should be all help one another.", "We all should help one another.", "We all should be helped one another."], answer: 2, explanation: "Option (c) is correct: 'We all should help one another' (for multiple people)." },
    { question: "Select the grammatically correct sentence.", options: ["The Supriya is the best girl in the class.", "Supriya is the best girl in the class.", "Supriya is best girl in the class.", "The Supriya is a best girl in the class."], answer: 1, explanation: "Proper nouns do not take articles normally, while superlatives require 'the best'. Hence (b)." },
    { question: "Sentence Improvement: The boys and the teacher wants to win.", options: ["want to win", "No improvement", "want winning", "wanted winning"], answer: 0, explanation: "Compound subject joined by 'and' takes a plural verb: 'want'." },
    { question: "Sentence improvement: The Indian independence movement sought to establish the conceptions of freedom and social welfare...", options: ["methods to sympathise", "concepts of liberty", "procedures of free mind", "symbols of victory"], answer: 1, explanation: "'concepts of liberty' fits historically and contextually better." },
    { question: "Sentence Improvement: The frog adopts itself to live both in water and on land.", options: ["No substitution", "frog alters itself", "frog adepts itself", "frog adapts itself"], answer: 3, explanation: "'adapts itself' means modifying behavior/features to fit surroundings." },
    { question: "Sentence Improvement: He was so curious that he rose many questions in the meeting.", options: ["that he raised many questions", "No substitution", "that he rose much questions", "that he aroused many questions"], answer: 0, explanation: "Questions are raised by someone. 'raised many questions'." },
    { question: "Sentence Improvement: It is reported that she has been won a prize money of ten lakhs at a reality show.", options: ["she had won", "she is winning", "No substitution required", "she has won"], answer: 3, explanation: "Active voice: 'she has won'." },
    { question: "Sentence Improvement: They have disposed all the old books.", options: ["disposed out", "disposed of", "disposed on", "disposed by"], answer: 1, explanation: "The phrasal verb is 'disposed of'." },
    { question: "Sentence Improvement: Do you know that she has invited me in her party?", options: ["has been invited me for", "has invited me to", "is invited me to", "No improvement"], answer: 1, explanation: "Correct preposition: 'invited me to her party'." },
    { question: "Sentence Improvement: The management is not beware of this fact.", options: ["aware of", "awaking to", "watchful with", "beware to"], answer: 0, explanation: "'aware of' is an adjective phrase; beware is used directly as a verb form." },
    { question: "Sentence Improvement: Irene went to office every single day by walk.", options: ["every single day by walking", "every single day with foot", "every day single by foot", "every single day on foot"], answer: 3, explanation: "Idiomatic usage: 'on foot'." },
    { question: "Sentence Improvement: The mob drove on the rampage and looted several shops in the locality.", options: ["played on the rampage", "strolled on the rampage", "ran on the rampage", "went on the rampage"], answer: 3, explanation: "Standard idiom: 'went on the rampage'." },
    { question: "Sentence Improvement: Please ask the dog to get of my couch.", options: ["get of mine", "get off my my", "No substitution", "get off mine"], answer: 1, explanation: "'get off my couch' (Note: the option provided in answer key matches choice b despite typo)." },
    { question: "Sentence Improvement: I will not go out if it will rain.", options: ["is raining", "rained", "it rains", "raining"], answer: 0, explanation: "Key says (a); conditional clauses can take simple present or continuous forms depending on focus." },
    { question: "Sentence Improvement: I don't wear the sunglasses at the moment.", options: ["I didn't wear", "I was wearing", "I wore", "I'm not wearing"], answer: 3, explanation: "'at the moment' signals present continuous: 'I'm not wearing'." },
    { question: "Sentence Improvement: I have not seen you for last year.", options: ["you for last years", "me for last year", "you since last year", "you about last year"], answer: 2, explanation: "Point of time requires 'since last year'." },
    { question: "Sentence Improvement: The Karaoke programme was planned by the club was a grand success.", options: ["has been planned by the club", "planned by the club", "No substitution", "were planned by the club"], answer: 1, explanation: "Reduced relative clause: 'The Karaoke programme planned by the club...'." },

let QUESTIONS = [];
let currentIdx = 0;
let userAnswers = {};
let timerSeconds = 0;
let quizMode = false;
let timerObj;

// Handle selection click event
document.getElementById('startQuizBtn').onclick = function() {
  const selectedValue = document.getElementById('classSelect').value;
  QUESTIONS = ALL_CLASSES[selectedValue];
  
  // Hide dropdown popup modal, display layout UI
  document.getElementById('classModal').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('footerBar').style.display = 'flex';
  
  init();
};

function init() {
  currentIdx = 0;
  userAnswers = {};
  timerSeconds = 0;
  document.getElementById('qtotal').innerText = QUESTIONS.length;
  renderQuestion();
  clearInterval(timerObj);
  startClock();
  setupPalette();
}

function renderQuestion() {
  const q = QUESTIONS[currentIdx];
  document.getElementById('qindex').innerText = currentIdx + 1;
  document.getElementById('qtext').innerHTML = `<strong>${q.question}</strong>`;
  document.getElementById('marking').innerHTML = `Marking: <span style="color:var(--success)">+2.00</span> / <span style="color:var(--danger)">-0.50</span>`;
  
  const optContainer = document.getElementById('options');
  const expContainer = document.getElementById('explanation');
  optContainer.innerHTML = "";
  expContainer.style.display = "none";

  q.options.forEach((txt, i) => {
    const div = document.createElement('div');
    div.className = 'opt' + (userAnswers[currentIdx] === i ? ' selected' : '');
    div.innerHTML = `<span>${String.fromCharCode(65 + i)}.</span> ${txt}`;
    div.onclick = () => { userAnswers[currentIdx] = i; renderQuestion(); updatePalette(); };
    optContainer.appendChild(div);
  });
  if (quizMode && userAnswers[currentIdx] !== undefined) showFeedback();
}

function showFeedback() {
  const q = QUESTIONS[currentIdx];
  const opts = document.getElementById('options').children;
  const exp = document.getElementById('explanation');
  Array.from(opts).forEach((el, i) => {
    el.classList.remove('correct', 'wrong');
    if (i === q.answer) el.classList.add('correct');
    else if (i === userAnswers[currentIdx]) el.classList.add('wrong');
  });
  exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
  exp.style.display = "block";
}

function startClock() {
  timerObj = setInterval(() => {
    timerSeconds++;
    const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const s = (timerSeconds % 60).toString().padStart(2, '0');
    document.getElementById('timer').innerText = `${m}:${s}`;
  }, 1000);
}

function setupPalette() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = "";
  QUESTIONS.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'qbtn';
    b.innerText = i + 1;
    b.onclick = () => { currentIdx = i; renderQuestion(); document.getElementById('palette').style.display = 'none'; };
    grid.appendChild(b);
  });
  updatePalette();
}

function updatePalette() {
  const btns = document.getElementById('paletteGrid').children;
  let attempted = 0;
  Array.from(btns).forEach((b, i) => {
    b.classList.remove('current', 'answered');
    if (i === currentIdx) b.classList.add('current');
    if (userAnswers[i] !== undefined) { b.classList.add('answered'); attempted++; }
  });
  document.getElementById('palette-summary').innerText = `Total: ${QUESTIONS.length} | Attempted: ${attempted}`;
}

document.getElementById('nextBtn').onclick = () => { if (currentIdx < QUESTIONS.length - 1) { currentIdx++; renderQuestion(); } };
document.getElementById('prevBtn').onclick = () => { if (currentIdx > 0) { currentIdx--; renderQuestion(); } };
document.getElementById('clearBtn').onclick = () => { delete userAnswers[currentIdx]; renderQuestion(); updatePalette(); };
document.getElementById('paletteBtn').onclick = () => { 
  const p = document.getElementById('palette');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  updatePalette();
};
document.getElementById('modeToggle').onclick = function() { this.classList.toggle('active'); quizMode = !quizMode; renderQuestion(); };
document.getElementById('submitBtn').onclick = () => { 
  document.getElementById('submitMsg').innerText = `Attempted ${Object.keys(userAnswers).length}/${QUESTIONS.length}`;
  document.getElementById('submitModal').style.display = 'flex'; 
};
document.getElementById('cancelSubmit').onclick = () => { document.getElementById('submitModal').style.display = 'none'; };
document.getElementById('confirmSubmit').onclick = () => { clearInterval(timerObj); document.getElementById('submitModal').style.display = 'none'; showResults(); };

function showResults() {
  let correct = 0;
  let reviewHTML = `<div class="card"><h2 style="text-align:center; color:var(--accent)">Review & Answer Key</h2>`;

  QUESTIONS.forEach((q, i) => {
    const isCorrect = userAnswers[i] === q.answer;
    if (isCorrect) correct++;
    const statusText = userAnswers[i] === undefined ? '<span style="color:var(--muted)">Unattempted</span>' : (isCorrect ? '<span style="color:var(--success); font-weight:bold">Correct</span>' : '<span style="color:var(--danger); font-weight:bold">Wrong</span>');

    reviewHTML += `
      <div class="review-q">
        <p><strong>Q${i+1}. ${q.question}</strong> (${statusText})</p>
        <div>
          ${q.options.map((opt, optIdx) => {
            let bgColor = "transparent"; let borderColor = "#eee";
            if (optIdx === q.answer) { bgColor = "#e8f5e9"; borderColor = "#4caf50"; }
            else if (optIdx === userAnswers[i]) { bgColor = "#ffebee"; borderColor = "#f44336"; }
            return `<div class="review-opt" style="border:1px solid ${borderColor}; background:${bgColor}; padding:8px; margin:4px 0; border-radius:5px;">${String.fromCharCode(65 + optIdx)}. ${opt} ${optIdx === q.answer ? '✅' : (optIdx === userAnswers[i] ? '❌' : '')}</div>`;
          }).join('')}
        </div>
        <div style="margin-top:10px; font-size:14px; background:#f9f9f9; padding:8px; border-radius:5px; border-left:3px solid var(--accent);">
          <strong>Explanation:</strong> ${q.explanation}
        </div>
      </div>`;
  });

  const wrong = Object.keys(userAnswers).length - correct;
  const score = (correct * 2) - (wrong * 0.5);
  
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('footerBar').style.display = 'none';
  const res = document.getElementById('results');
  res.style.display = 'block';
  res.innerHTML = `
    <div class="card">
      <h2 style="text-align:center; color:var(--accent)">Results Summary</h2>
      <div class="stats-grid">
        <div class="stat-box"><h4>Score</h4><p>${score.toFixed(2)}</p></div>
        <div class="stat-box"><h4>Correct</h4><p>${correct}</p></div>
        <div class="stat-box"><h4>Wrong</h4><p>${wrong}</p></div>
        <div class="stat-box"><h4>Time</h4><p>${document.getElementById('timer').innerText}</p></div>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
        <button class="btn" onclick="downloadResult()">Download Result</button>
        <button class="btn" style="background:#6c757d" onclick="location.reload()">Re-Attempt / Change Class</button>
      </div>
    </div>
    ${reviewHTML}
  `;
}

function downloadResult() {
    const resultsContent = document.getElementById('results').innerHTML;
    const blob = new Blob([`<html><head><style>body{font-family:sans-serif; padding:20px;} .card{border:1px solid #ddd; padding:20px; border-radius:10px; margin-bottom:10px;} .stats-grid{display:flex; gap:20px;} .review-opt{padding:5px; margin:2px; border:1px solid #eee; border-radius:5px;}</style></head><body>${resultsContent}</body></html>`], {type: 'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Exam_Scorecard.html'; a.click();
}
</script>
</body>
</html>
