<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mixed Grammar Practice Test - Aman Sir English</title>
<style>
:root{
  --accent:#2ec4b6;
  --accent-dark:#1da89a;
  --muted:#69707a;
  --success:#1f9e5a;
  --danger:#c82d3f;
  --bg:#f5f7fa;
  --card:#fff;
  --maxw:820px;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#111;padding-bottom:120px}
.container{max-width:var(--maxw);margin:auto;padding:10px 16px}
header{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.08);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:12px}
h1{margin:0;color:var(--accent);font-size:18px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent-dark)}
.btn-ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);padding:8px 12px;border-radius:999px;font-weight:700;cursor:pointer}
.timer-text{color:var(--accent-dark);font-weight:700;font-size:18px;min-width:72px;text-align:right}
.toggle-pill{position:relative;width:90px;height:30px;background:#eaeef0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:13px;color:#444;font-weight:600}
.toggle-pill span{z-index:2;flex:1;text-align:center;pointer-events:none}
.toggle-pill::before{content:"";position:absolute;top:3px;left:3px;width:42px;height:24px;background:var(--accent);border-radius:999px;transition:.28s}
.toggle-pill.active::before{transform:translateX(45px);background:var(--accent-dark)}
.toggle-pill.active span:last-child{color:#fff}
.toggle-pill span:first-child{color:#fff}
.card{background:var(--card);border-radius:10px;padding:15px;margin:12px 0;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qmeta, .marking{font-size:13px;color:var(--muted)}
.qtext{font-size:16px;margin-bottom:15px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:10px}
.opt{padding:12px;border:1px solid #e6eaec;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent)}
.opt.selected{border:2px solid var(--accent)}
.opt.correct{border:2px solid var(--success);background:rgba(31,158,90,0.1)}
.opt.wrong{border:2px solid var(--danger);background:rgba(200,45,63,0.1)}
.fbar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -3px 12px rgba(0,0,0,0.08);display:flex;justify-content:center;z-index:50}
.fbar-inner{display:flex;justify-content:center;gap:15px;width:100%;padding:15px}

/* SCROLLABLE PALETTE */
#palette{position:fixed;top:70px;right:20px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.15);padding:15px;display:none;flex-direction:column;z-index:200;max-width:280px;max-height:70vh;}
.palette-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;overflow-y:auto;padding-right:5px;}
.qbtn{width:40px;height:40px;border-radius:6px;border:1px solid #ddd;cursor:pointer;font-weight:bold;flex-shrink:0;}
.qbtn.answered{background:var(--accent);color:white;border:none}
.qbtn.current{border:2px solid var(--accent);background:rgba(46,196,182,0.1)}
#palette-summary{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid #eee;padding-top:8px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:300}
.modal-content{background:#fff;padding:25px;border-radius:12px;text-align:center;width:90%;max-width:400px}
.explanation{margin-top:15px;padding:12px;background:#f0f7f7;border-radius:8px;display:none;font-size:14px;border-left:4px solid var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));gap:10px;margin-bottom:20px}
.stat-box{background:#f8fafb;padding:10px;border-radius:8px;border:1px solid #eef1f2;text-align:center}
.stat-box h4{margin:0;font-size:12px;color:var(--muted)}
.stat-box p{margin:5px 0 0;font-weight:bold;font-size:18px;color:var(--accent)}
.review-q{border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px;}
.review-opt{padding: 8px; margin: 4px 0; border-radius: 5px; font-size: 14px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="toggle-pill" id="modeToggle"><span>Test</span><span>Quiz</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="timer-text" id="timer">00:00</div>
      <button id="submitBtn" class="btn">Submit</button>
      <button id="paletteBtn" class="btn-ghost">View</button>
    </div>
  </div>
</header>

<div class="container">
  <div id="quizCard" class="card">
    <div class="qbar">
      <div class="qmeta">Question <span id="qindex">1</span> / <span id="qtotal">0</span></div>
      <div class="marking" id="marking"></div>
    </div>
    <div id="passageArea" style="background:#f9f9f9; padding:15px; border-radius:8px; margin-bottom:15px; font-size:15px; display:none;"></div>
    <div class="qtext" id="qtext"></div>
    <div class="options" id="options"></div>
    <div id="explanation" class="explanation"></div>
  </div>

  <div id="results" class="results" style="display:none"></div>
</div>

<div class="fbar" id="footerBar">
  <div class="fbar-inner">
    <button id="prevBtn" class="btn">← Prev</button>
    <button id="clearBtn" class="btn" style="background:#6c757d">Clear</button>
    <button id="nextBtn" class="btn">Next →</button>
  </div>
</div>

<div id="palette">
    <div class="palette-grid" id="paletteGrid"></div>
    <div id="palette-summary"></div>
</div>

<div id="submitModal" class="modal">
  <div class="modal-content">
    <h3>Submit Quiz?</h3>
    <p id="submitMsg"></p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:20px">
      <button id="cancelSubmit" class="btn-ghost">Cancel</button>
      <button id="confirmSubmit" class="btn">Confirm</button>
    </div>
  </div>
</div>

<script>
let PASSAGE_TEXT = "";
const QUESTIONS = [
  /* SECTION 1: QUESTION TAGS (1-30) */
  {
    id: 1,
    question: "Your cousin (a)/ practises advanced photography techniques regularly (b)/ to improve his creative portfolio, (c)/ does he? (d)",
    options: ["Your cousin", "practises advanced photography techniques regularly", "to improve his creative portfolio,", "does he?"],
    answer: 3,
    explanation: "Correction: Use 'doesn't he' instead of 'does he'. A positive statement requires a negative question tag[cite: 13]."
  },
  {
    id: 2,
    question: "There will probably be a huge crowd (a)/ outside the stadium tonight as the organisers (b)/ are distributing free entry passes, (c)/ will there? (d)",
    options: ["There will probably be a huge crowd", "outside the stadium tonight as the organisers", "are distributing free entry passes,", "will there?"],
    answer: 3,
    explanation: "Correction: Use 'won't there' instead of 'will there'. Since the main clause is affirmative ('There will probably be...'), the question tag must be negative[cite: 13]."
  },
  {
    id: 3,
    question: "I am supposed to submit (a)/ the revised assignment today, after carefully (b)/ analysing the teacher's feedback (c)/, am I? (d)",
    options: ["I am supposed to submit", "the revised assignment today, after carefully", "analysing the teacher's feedback", "am I?"],
    answer: 3,
    explanation: "Correction: Use 'aren't I' instead of 'am I'. For positive clauses starting with 'I am', the corresponding standard question tag format is 'aren't I'[cite: 13]."
  },
  {
    id: 4,
    question: "Sentence Improvement: You have taken proper safety measures in the laboratory today, such as wearing protective gloves and goggles, isn't it?",
    options: ["did you", "no substitution", "have you", "haven't you"],
    answer: 3,
    explanation: "Option (d) is correct. The main verb uses the present perfect auxiliary 'have' in a positive form, so the tag must be 'haven't you'[cite: 13]."
  },
  {
    id: 5,
    question: "Sentence Improvement: The new policies have been implemented successfully across all departments, isn't it?",
    options: ["haven't they", "no substitution", "have they", "didn't they"],
    answer: 0,
    explanation: "Option (a) is correct. The subject is plural ('The new policies') and the auxiliary is positive present perfect ('have'), demanding a matching negative tag 'haven't they'[cite: 13]."
  },
  {
    id: 6,
    question: "Sentence Improvement: She will have to submit all her pending assignments before the final review begins next week, has she?",
    options: ["no substitution", "won't she", "will she", "hasn't she"],
    answer: 1,
    explanation: "Option (b) is correct. The modal statement introduces future reference with 'will', so the correct negative tag pattern is 'won't she'[cite: 13]."
  },
  {
    id: 7,
    question: "Sentence Improvement: She is not comfortable speaking in front of a large audience during formal events, isn't it?",
    options: ["is she", "isn't she", "is it", "no improvement"],
    answer: 0,
    explanation: "Option (a) is correct. A negative statement ('is not comfortable') requires a corresponding positive question tag: 'is she'[cite: 13]."
  },
  {
    id: 8,
    question: "Sentence Improvement: You will attend the official briefing tomorrow morning before the training session begins, won't you?",
    options: ["isn't it", "didn't you", "no improvement", "will you"],
    answer: 2,
    explanation: "Option (c) requires no improvement. The positive modal layout 'will attend' matches perfectly with the negative tag 'won't you'[cite: 13]."
  },
  {
    id: 9,
    question: "Sentence Improvement: The train was delayed for several hours because of a technical fault in the signalling system, isn't it?",
    options: ["didn't it", "wasn't it", "was it", "no substitution"],
    answer: 1,
    explanation: "Option (b) is correct. The main clause relies on the simple past singular auxiliary 'was', which sets up the proper tag 'wasn't it'[cite: 13]."
  },
  {
    id: 10,
    question: "Sentence Improvement: You have all the required documents for the verification process today, including your identity proofs and address records, isn't it?",
    options: ["don't you", "no improvement", "do you", "has you"],
    answer: 0,
    explanation: "Option (a) is correct. Here 'have' acts as the principal possessive main verb in simple present tense, which forms its tag via 'don't you'[cite: 13]."
  },
  {
    id: 11,
    question: "Sentence Improvement: We can't succeed in this competitive examination without consistent practice and proper time management, will we?",
    options: ["won't we", "can we", "do we", "no improvement"],
    answer: 1,
    explanation: "Option (b) is correct. The negative modal base ' can't succeed' calls for the direct positive tag option: 'can we'[cite: 13]."
  },
  {
    id: 12,
    question: "Sentence Improvement: I believe you have completed the draft of your research report after reviewing all the reference materials carefully, don't I?",
    options: ["did you", "haven't you", "have you", "No substitution"],
    answer: 1,
    explanation: "Option (b) is correct. The actual focal clause stating the core message is 'you have completed', which requires the matching perfect tag 'haven't you'[cite: 13]."
  },
  {
    id: 13,
    question: "Fill in the blank: Neither of the applicants was informed about the change in the interview schedule, ______?",
    options: ["wasn't they", "weren't they", "did they", "were they"],
    answer: 3,
    explanation: "Option (d) is correct. 'Neither' makes the clause inherently negative, requiring a positive tag. Pronouns tracking distributed singular allocations ('Neither of...') switch to plural 'they' inside tags, making 'were they' accurate[cite: 13]."
  },
  {
    id: 14,
    question: "Fill in the blank: Everybody should follow the safety guidelines issued by the authorities during large public gatherings, ______?",
    options: ["should they", "should he", "shouldn't they", "shouldn't we"],
    answer: 2,
    explanation: "Option (c) is correct. Indefinite collective pronouns like 'Everybody' take the plural tag pronoun 'they', matching the positive modal layout with 'shouldn't they'[cite: 13]."
  },
  {
    id: 15,
    question: "Fill in the blank: All of them have booked their tickets for the cultural festival that will be held in the neighbouring state next month, ______?",
    options: ["haven't we", "don't they", "haven't they", "have they"],
    answer: 2,
    explanation: "Option (c) is correct. The compound phrase 'All of them' aligns with a present perfect positive auxiliary, making 'haven't they' the correct tag[cite: 13]."
  },
  {
    id: 16,
    question: "Fill in the blank: Anyone will support the initiative which is started by him to educate the poor children, ______?",
    options: ["won't he", "won't you", "won't they", "will they"],
    answer: 2,
    explanation: "Option (c) is correct. The indeterminate subject 'Anyone' translates to 'they' inside question tags, resulting in the negative structure 'won't they'[cite: 13]."
  },
  {
    id: 17,
    question: "Fill in the blank: None of us realised the importance of the safety instructions written everywhere at the construction site, ______?",
    options: ["didn't I", "did we", "mustn't you", "had we"],
    answer: 1,
    explanation: "Option (b) is correct. 'None' adds a negative context to the sentence. The phrase 'None of us' represents 'we', which requires the simple past positive tag 'did we'[cite: 13]."
  },
  {
    id: 18,
    question: "Fill in the blank: Nobody in the neighbourhood trusts the rumours that have been circulating on social media for the past few days, ______?",
    options: ["does he", "do they", "hasn't he", "won't they"],
    answer: 1,
    explanation: "Option (b) is correct. Negative anchors like 'Nobody' switch to plural 'they' in tags. Since the baseline clause uses simple present ('trusts'), it requires the plural positive helper 'do they'[cite: 13]."
  },
  {
    id: 19,
    question: "Fill in the blank: He ______ several practice tests over the weekend to improve his speed and accuracy for the upcoming exam, didn't he?",
    options: ["didn't take", "took", "takes", "had taken"],
    answer: 1,
    explanation: "Option (b) is correct. The tag 'didn't he' signals an affirmative simple past configuration, which matches 'took'[cite: 13]."
  },
  {
    id: 20,
    question: "Fill in the blank: The council has announced its revised guidelines to ensure more transparency in the admission process, ______?",
    options: ["does it", "hasn't it", "hasn't they", "has it"],
    answer: 1,
    explanation: "Option (b) is correct. 'The council' functions as a collective singular unit, requiring a singular negative present perfect tag: 'hasn't it'[cite: 13]."
  },
  {
    id: 21,
    question: "Fill in the blank: Let's discuss the remaining points of the project in the meeting room, ______?",
    options: ["will we", "shall we", "should we", "shouldn't we"],
    answer: 1,
    explanation: "Option (b) is correct. Suggestions or proposals introduced via 'Let's' carry a conventional fixed question tag format: 'shall we'[cite: 13]."
  },
  {
    id: 22,
    question: "Fill in the blank: All of you were called by the principal to his office on Monday, ______?",
    options: ["wasn't they", "weren't they", "weren't you", "were you"],
    answer: 2,
    explanation: "Option (c) is correct. The expression 'All of you' directs the tag pronoun to 'you', matching the positive past auxiliary with 'weren't you'[cite: 13]."
  },
  {
    id: 23,
    question: "Fill in the blank: The police are investigating several leads to identify the main suspect involved in the recent robbery, ______?",
    options: ["isn't it", "aren't it", "aren't they", "are they"],
    answer: 2,
    explanation: "Option (c) is correct. 'The police' behaves as an inherent collective plural tracking block, so the positive present progressive verb maps to 'aren't they'[cite: 13]."
  },
  {
    id: 24,
    question: "Fill in the blank: She hardly speaks to anyone in the neighbourhood unless it is absolutely necessary, ______?",
    options: ["didn't she", "doesn't she", "does she", "can't she"],
    answer: 2,
    explanation: "Option (c) is correct. The restrictive adverb 'hardly' makes the clause negative, demanding the positive present tag choice 'does she'[cite: 13]."
  },
  {
    id: 25,
    question: "Fill in the blank: One should not make important decisions in life under any pressure, ______?",
    options: ["should he", "shouldn't he", "should one", "does he"],
    answer: 2,
    explanation: "Option (c) is correct. When the generic subject 'One' anchors a statement, its structural trace is preserved inside the tag ('should one')[cite: 13]."
  },
  {
    id: 26,
    question: "Fill in the blank: He used to visit his grandparents every summer vacation when he was a child, ______?",
    options: ["wasn't he", "did he", "didn't he", "was he"],
    answer: 2,
    explanation: "Option (c) is correct. Habitual historical frameworks built on 'used to' form their corresponding negative tag via the simple past auxiliary 'didn't he'[cite: 13]."
  },
  {
    id: 27,
    question: "Fill in the blank: They dare not speak about this confidential issue openly, ______?",
    options: ["do they", "dare they", "don't they", "dare I"],
    answer: 1,
    explanation: "Option (b) is correct. Here, 'dare' serves as a negative modal auxiliary ('dare not'), which calls for the matching positive modal tag 'dare they'[cite: 13]."
  },
  {
    id: 28,
    question: "Fill in the blank: She should have informed her parents earlier about the situation instead of waiting until the last moment, ______?",
    options: ["hasn't she", "shouldn't she", "haven't she", "shouldn't he"],
    answer: 1,
    explanation: "Option (b) is correct. The affirmative modal auxiliary 'should' requires its corresponding negative tag format: 'shouldn't she'[cite: 13]."
  },
  {
    id: 29,
    question: "Fill in the blank: She has been working tirelessly on this project since the beginning of the semester to ensure everything is completed on time, ______?",
    options: ["isn't she", "hasn't she", "has she", "didn't she"],
    answer: 1,
    explanation: "Option (b) is correct. Present perfect continuous positive frameworks ('has been working') map to the standard tag 'hasn't she'[cite: 13]."
  },
  {
    id: 30,
    question: "Fill in the blank: Students ought to submit their research projects before the final review meeting, ______?",
    options: ["ought they?", "oughtn't they?", "don't they?", "shouldn't they?"],
    answer: 1,
    explanation: "Option (b) is correct. The affirmative semi-modal 'ought to' matches with the negative question tag layout 'oughtn't they?'[cite: 13]."
  },

  /* SECTION 2: SUPERFLUOUS + MISCELLANEOUS (31-60) */
  {
    id: 31,
    question: "While finalising the (a)/ lengthy rental agreement, the landlord (b)/ requested the tenant to put her sign (c)/ on each page of the contract. (d)",
    options: ["While finalising the", "lengthy rental agreement, the landlord", "requested the tenant to put her sign", "on each page of the contract."],
    answer: 2,
    explanation: "Correction: Use 'signature' instead of 'sign'. 'Sign' is a verb; the possessive determiner 'her' requires the noun 'signature'[cite: 13]."
  },
  {
    id: 32,
    question: "His elder sister has been (a)/ working in foreign for more than (b)/ five years, although she frequently visits home (c)/ to spend time with her parents. (d)",
    options: ["His elder sister has been", "working in foreign for more than", "five years, although she frequently visits home", "to spend time with her parents."],
    answer: 1,
    explanation: "Correction: Use 'abroad' instead of 'in foreign'. The expression 'in foreign' is ungrammatical; 'working abroad' is the standard phrase[cite: 13]."
  },
  {
    id: 33,
    question: "While conducting a practice session, (a)/ the English teacher advised the students to revise the grammar rules (b)/ thoroughly before attempting the practice questions. (c)/ No error (d)",
    options: ["While conducting a practice session,", "the English teacher advised the students", "to revise the grammar rules thoroughly...", "No error"],
    answer: 1,
    explanation: "Correction: Use 'the teacher of English' instead of 'the English teacher' to clarify the professional specialty without nationality ambiguity[cite: 13]."
  },
  {
    id: 34,
    question: "Unless she doesn't submit (a)/ all the required documents her application (b)/ for the scholarship will not be processed. (c)/ No error (d)",
    options: ["Unless she doesn't submit", "all the required documents her application", "for the scholarship will not be processed.", "No error"],
    answer: 0,
    explanation: "Correction: Replace 'unless she doesn't submit' with 'unless she submits'. 'Unless' introduces an inherently negative condition, making 'doesn't' a redundant double negative[cite: 13]."
  },
  {
    id: 35,
    question: "He warned them that the boy (a)/ they were making fun of was his cousin brother (b)/ and that such behaviour would not be tolerated by him. (c)/ No error (d)",
    options: ["He warned them that the boy", "they were making fun of was his cousin brother", "and that such behaviour would not be tolerated", "No error"],
    answer: 1,
    explanation: "Correction: Remove 'brother' after 'cousin'. Adding 'brother' or 'sister' to 'cousin' is redundant in standard English[cite: 13]."
  },
  {
    id: 36,
    question: "You need not worry (a)/ because the finance department (b)/ has assured that it will reimburse back all the travel expenses. (c)/ No error (d)",
    options: ["You need not worry", "because the finance department", "has assured that it will reimburse back", "No error"],
    answer: 2,
    explanation: "Correction: Remove 'back' after 'reimburse'. 'Reimburse' inherently means to pay back, making the modifier 'back' superfluous[cite: 13]."
  },
  {
    id: 37,
    question: "These programmes which play a crucial (a)/ role in enhancing employment opportunities (b)/ in several underdeveloped regions. (c) No error (d)",
    options: ["These programmes which play a crucial", "role in enhancing employment opportunities", "in several underdeveloped regions.", "No error"],
    answer: 0,
    explanation: "Correction: Remove 'which'. Including the relative pronoun leaves the main sentence without a functional finite verb link[cite: 13]."
  },
  {
    id: 38,
    question: "A student who has worked consistently (a)/ throughout the year he will surely perform well (b)/ in the final examinations that the university conducts annually. (c)/ No error (d)",
    options: ["A student who has worked consistently", "throughout the year he will surely perform well", "in the final examinations that the university...", "No error"],
    answer: 1,
    explanation: "Correction: Remove pronoun 'he'. The principal subject noun 'A student' is already positioned to govern the upcoming verb phrase directly[cite: 13]."
  },
  {
    id: 39,
    question: "The villagers decided to rebuild (a)/ the old community hall again after (b)/ it got damaged in the heavy storm. (c)/ No error (d)",
    options: ["The villagers decided to rebuild", "the old community hall again after", "it got damaged in the heavy storm.", "No error"],
    answer: 1,
    explanation: "Correction: Remove 'again' after 'community hall'. The prefix 're-' in 'rebuild' already signifies performing the action again[cite: 13]."
  },
  {
    id: 40,
    question: "The athlete was very (a)/ strong enough to complete the entire marathon (b)/ despite the harsh weather conditions. (c)/ No error (d)",
    options: ["The athlete was very", "strong enough to complete the entire marathon", "despite the harsh weather conditions.", "No error"],
    answer: 0,
    explanation: "Correction: Remove 'very'. Modifying an adjective with both 'very' and 'enough' simultaneously is redundant[cite: 13]."
  },
  {
    id: 41,
    question: "The students are angry because (a)/ the passing marks have been increased to fifty percent (b)/ by the institution just before the final examinations (c)/ No error (d)",
    options: ["The students are angry because", "the passing marks have been increased to fifty percent", "by the institution just before the final...", "No error"],
    answer: 1,
    explanation: "Correction: Use 'pass marks' instead of 'passing marks'. 'Pass marks' is the grammatically accurate compound noun[cite: 13]."
  },
  {
    id: 42,
    question: "They worked in (a)/ this remote village for a brief period of time (b)/ before shifting to the nearby town (c)/ to start their new business venture. (d)",
    options: ["They worked in", "this remote village for a brief period of time", "before shifting to the nearby town", "to start their new business venture."],
    answer: 1,
    explanation: "Correction: Remove 'of time' after 'period'. A 'period' inherently implies a duration of time, making extra descriptors superfluous[cite: 13]."
  },
  {
    id: 43,
    question: "The coach forbade (a)/ the players not to (b)/ consume junk food during the training period (c)/ as it could negatively affect their performance. (d)",
    options: ["The coach forbade", "the players not to", "consume junk food during the training period", "as it could negatively affect their performance."],
    answer: 1,
    explanation: "Correction: Remove 'not' from part (b). The verb 'forbade' carries an inherent negative meaning (to prohibit), making an extra 'not' a double negative error[cite: 13]."
  },
  {

let currentIdx = 0;
let userAnswers = {};
let timerSeconds = 0;
let quizMode = false;
let timerObj;

window.onload = function() {
  if (QUESTIONS.length > 0) {
    init();
  }
};

function init() {
  document.getElementById('qtotal').innerText = QUESTIONS.length;
  if(PASSAGE_TEXT) { 
    document.getElementById('passageArea').innerText = PASSAGE_TEXT; 
    document.getElementById('passageArea').style.display = "block"; 
  }
  renderQuestion();
  startClock();
  setupPalette();
}

function renderQuestion() {
  const q = QUESTIONS[currentIdx];
  document.getElementById('qindex').innerText = currentIdx + 1;
  document.getElementById('qtext').innerHTML = `<strong>Q:${q.id} ${q.question}</strong>`;
  document.getElementById('marking').innerHTML = `Marking: <span style="color:var(--success)">+2.00</span> / <span style="color:var(--danger)">-0.50</span>`;
  
  const optContainer = document.getElementById('options');
  const expContainer = document.getElementById('explanation');
  optContainer.innerHTML = "";
  expContainer.style.display = "none";

  q.options.forEach((txt, i) => {
    const div = document.createElement('div');
    div.className = 'opt' + (userAnswers[currentIdx] === i ? ' selected' : '');
    div.innerHTML = `<span>${String.fromCharCode(65 + i)}.</span> ${txt}`;
    div.onclick = () => { userAnswers[currentIdx] = i; renderQuestion(); updatePalette(); };
    optContainer.appendChild(div);
  });
  if (quizMode && userAnswers[currentIdx] !== undefined) showFeedback();
}

function showFeedback() {
  const q = QUESTIONS[currentIdx];
  const opts = document.getElementById('options').children;
  const exp = document.getElementById('explanation');
  Array.from(opts).forEach((el, i) => {
    el.classList.remove('correct', 'wrong');
    if (i === q.answer) el.classList.add('correct');
    else if (i === userAnswers[currentIdx]) el.classList.add('wrong');
  });
  exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
  exp.style.display = "block";
}

function startClock() {
  timerObj = setInterval(() => {
    timerSeconds++;
    const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const s = (timerSeconds % 60).toString().padStart(2, '0');
    document.getElementById('timer').innerText = `${m}:${s}`;
  }, 1000);
}

function setupPalette() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = "";
  QUESTIONS.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'qbtn';
    b.innerText = i + 1;
    b.onclick = () => { currentIdx = i; renderQuestion(); document.getElementById('palette').style.display = 'none'; };
    grid.appendChild(b);
  });
  updatePalette();
}

function updatePalette() {
  const btns = document.getElementById('paletteGrid').children;
  let attempted = 0;
  Array.from(btns).forEach((b, i) => {
    b.classList.remove('current', 'answered');
    if (i === currentIdx) b.classList.add('current');
    if (userAnswers[i] !== undefined) { b.classList.add('answered'); attempted++; }
  });
  document.getElementById('palette-summary').innerText = `Total: ${QUESTIONS.length} | Attempted: ${attempted}`;
}

document.getElementById('nextBtn').onclick = () => { if (currentIdx < QUESTIONS.length - 1) { currentIdx++; renderQuestion(); } };
document.getElementById('prevBtn').onclick = () => { if (currentIdx > 0) { currentIdx--; renderQuestion(); } };
document.getElementById('clearBtn').onclick = () => { delete userAnswers[currentIdx]; renderQuestion(); updatePalette(); };
document.getElementById('paletteBtn').onclick = () => { 
  const p = document.getElementById('palette');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  updatePalette();
};
document.getElementById('modeToggle').onclick = function() { this.classList.toggle('active'); quizMode = !quizMode; renderQuestion(); };
document.getElementById('submitBtn').onclick = () => { 
  document.getElementById('submitMsg').innerText = `Attempted ${Object.keys(userAnswers).length}/${QUESTIONS.length}`;
  document.getElementById('submitModal').style.display = 'flex'; 
};
document.getElementById('cancelSubmit').onclick = () => { document.getElementById('submitModal').style.display = 'none'; };
document.getElementById('confirmSubmit').onclick = () => { clearInterval(timerObj); document.getElementById('submitModal').style.display = 'none'; showResults(); };

function showResults() {
  let correct = 0;
  let reviewHTML = `<div class="card"><h2 style="text-align:center; color:var(--accent)">Review & Answer Key</h2>`;

  QUESTIONS.forEach((q, i) => {
    const isCorrect = userAnswers[i] === q.answer;
    if (isCorrect) correct++;
    const statusText = userAnswers[i] === undefined ? '<span style="color:var(--muted)">Unattempted</span>' : (isCorrect ? '<span style="color:var(--success); font-weight:bold">Correct</span>' : '<span style="color:var(--danger); font-weight:bold">Wrong</span>');

    reviewHTML += `
      <div class="review-q">
        <p><strong>Q:${q.id}. ${q.question}</strong> (${statusText})</p>
        <div>
          ${q.options.map((opt, optIdx) => {
            let bgColor = "transparent"; let borderColor = "#eee";
            if (optIdx === q.answer) { bgColor = "#e8f5e9"; borderColor = "#4caf50"; }
            else if (optIdx === userAnswers[i]) { bgColor = "#ffebee"; borderColor = "#f44336"; }
            return `<div class="review-opt" style="border:1px solid ${borderColor}; background:${bgColor}; padding:8px; margin:4px 0; border-radius:5px;">${String.fromCharCode(65 + optIdx)}. ${opt} ${optIdx === q.answer ? '✅' : (optIdx === userAnswers[i] ? '❌' : '')}</div>`;
          }).join('')}
        </div>
        <div style="margin-top:10px; font-size:14px; background:#f9f9f9; padding:8px; border-radius:5px; border-left:3px solid var(--accent);">
          <strong>Explanation:</strong> ${q.explanation}
        </div>
      </div>`;
  });

  const wrong = Object.keys(userAnswers).length - correct;
  const score = (correct * 2) - (wrong * 0.5);
  
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('footerBar').style.display = 'none';
  const res = document.getElementById('results');
  res.style.display = 'block';
  res.innerHTML = `
    <div class="card">
      <h2 style="text-align:center; color:var(--accent)">Results Summary</h2>
      <div class="stats-grid">
        <div class="stat-box"><h4>Score</h4><p>${score.toFixed(2)}</p></div>
        <div class="stat-box"><h4>Correct</h4><p>${correct}</p></div>
        <div class="stat-box"><h4>Wrong</h4><p>${wrong}</p></div>
        <div class="stat-box"><h4>Time</h4><p>${document.getElementById('timer').innerText}</p></div>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
        <button class="btn" onclick="downloadResult()">Download Result</button>
        <button class="btn" style="background:#6c757d" onclick="location.reload()">Re-Attempt</button>
      </div>
    </div>
    ${reviewHTML}
  `;
}

function downloadResult() {
    const resultsContent = document.getElementById('results').innerHTML;
    const blob = new Blob([`<html><head><style>body{font-family:sans-serif; padding:20px;} .card{border:1px solid #ddd; padding:20px; border-radius:10px; margin-bottom:10px;} .stats-grid{display:flex; gap:20px;} .review-opt{padding:5px; margin:2px; border:1px solid #eee; border-radius:5px;}</style></head><body>${resultsContent}</body></html>`], {type: 'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Exam_Scorecard.html'; a.click();
}
</script>
</body>
